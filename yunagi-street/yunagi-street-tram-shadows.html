          pixels.data[i+1]=119+highlight*91;
          pixels.data[i+2]=161+highlight*49;
          pixels.data[i+3]=density*136;
        }
        cloudContext.putImageData(pixels,0,0);
        ctx.drawImage(cloudCanvas,0,0,w,h);
        for (const [x,y,r] of [[.73,.12,.9],[.82,.172,.69],[.929,.093,.75],[.911,.225,.58],[.58,.18,.57],[.48,.10,.49],[.664,.235,.53],[.27,.15,.52]]) {
          ctx.fillStyle = '#f6e5dfb2';
          ctx.beginPath();
          ctx.arc(x*w,y*h,r,0,2*Math.PI);
          ctx.fill();
        }
      });
    }

    function makeEveningEnvironment(renderer, rainy = false) {
      // Linear HDR radiance keeps a bright sunset in reflections without whitening
      // every wall. All pixels are synthesized locally; there is no HDR asset.
      const w=512,h=256,pixels=new Float32Array(w*h*4);
      const upper=new THREE.Color(rainy?'#8da8bc':'#8899ba'),horizon=new THREE.Color(rainy?'#bac9d2':'#c8bacb');
      const lower=new THREE.Color(rainy?'#526273':'#535465'),sunTint=new THREE.Color('#ffe1c4');
      const direction=EVENING_SUN.clone().normalize();
      const sample=new THREE.Vector3(),color=new THREE.Color();
      for(let y=0;y<h;y++)for(let x=0;x<w;x++){
        const elevation=((y+.5)/h-.5)*Math.PI;
        const azimuth=((x+.5)/w-.5)*Math.PI*2;
        const cos=Math.cos(elevation);
        sample.set(Math.cos(azimuth)*cos,Math.sin(elevation),Math.sin(azimuth)*cos);
        if(sample.y>=0)color.copy(horizon).lerp(upper,Math.pow(sample.y,.46));
        else color.copy(horizon).lerp(lower,Math.min(1,-sample.y*3.5));
        const alignment=sample.dot(direction);
        const glow=rainy ? 0 : Math.exp((alignment-1)*6)*.30+Math.exp((alignment-1)*48)*1.1;
        const disk=rainy ? 0 : Math.exp((alignment-1)*15000)*4;
        color.r+=sunTint.r*(glow+disk);
        color.g+=sunTint.g*(glow+disk);
        color.b+=sunTint.b*(glow+disk);
        const i=(y*w+x)*4;
        pixels[i]=color.r;pixels[i+1]=color.g;pixels[i+2]=color.b;pixels[i+3]=1;
      }
      const sky=new THREE.DataTexture(pixels,w,h,THREE.RGBAFormat,THREE.FloatType);
      sky.colorSpace=THREE.LinearSRGBColorSpace;
      sky.needsUpdate=true;
      sky.mapping = THREE.EquirectangularReflectionMapping;
      const generator = new THREE.PMREMGenerator(renderer);
      const environment = generator.fromEquirectangular(sky);
      generator.dispose();
      sky.dispose();
      return environment.texture;
    }

    // Damp streaks and puddles left on the carriageway by the passing shower.
    // The same mask drives the mirror-like puddle reflections and the
    // roughness and clearcoat of the asphalt underneath.
    let roadWetnessCanvas = null;
    function roadWetness() {
      if (roadWetnessCanvas) return roadWetnessCanvas;
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 1536;
      paintRoadWetness(canvas.getContext('2d'), canvas.width, canvas.height);
      return roadWetnessCanvas = canvas;
    }

    function paintRoadWetness(ctx,w,h) {
      const random = randomFrom(623);
      const width = ROAD_RIGHT-ROAD_LEFT;
      function streak(x,z,rx,rz,strength) {
        ctx.save();
        ctx.translate((x-ROAD_LEFT)/width*w,(z-SITE_BACK)/SITE_LENGTH*h);
        ctx.scale(rx*w/width,rz*h/SITE_LENGTH);
        const gradient = ctx.createRadialGradient(0,0,0,0,0,1);
        gradient.addColorStop(0,`rgba(255,255,255,${strength})`);
        gradient.addColorStop(.49,`rgba(255,255,255,${strength*.68})`);
        gradient.addColorStop(1,'rgba(255,255,255,0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(-1,-1,2,2);
        ctx.restore();
      }
      for (const [x,z,rx,rz] of [[4.18,2.0,.70,3.1],[.32,-.2,.90,3.1],[.32,6.5,.81,2.65],[2.3,8.1,1.02,2.8],[3.12,-9.9,1.44,2.54],[1.5,-6.23,1.0,2.56],[4.47,12.4,.43,1.6],[.02,11.5,.49,1.9]]) {
        streak(x,z,rx,rz,.80);
        for (let n=0;n<11;n++) {
          streak(x+(random()-.5)*rx*1.65,z+(random()-.5)*rz*1.68,rx*(.18+random()*.40),rz*(.08+random()*.26),.19+random()*.32);
        }
      }
      for (let i=0;i<2300;i++) {
        ctx.globalCompositeOperation = random() > .24 ? 'destination-out' : 'source-atop';
        ctx.fillStyle = `rgba(255,255,255,${random()*.54})`;
        ctx.fillRect(random()*w,random()*h,1+random()*3,1+random()*5);
      }
    }

    function wetAsphaltMap() {
      return paintedTexture(128,1044,(ctx,w,h)=>{
        ctx.fillStyle = 'rgb(89,219,0)';     // r: light dampness, g: dry roughness
        ctx.fillRect(0, 0, w, h);
        const patch = document.createElement('canvas');
        patch.width = 512;
        patch.height = 1536;
        const patchContext = patch.getContext('2d');
        patchContext.drawImage(roadWetness(), 0, 0);
        patchContext.globalCompositeOperation = 'source-in';
        patchContext.fillStyle = 'rgb(255,46,0)';   // standing water: full coat, smooth
        patchContext.fillRect(0, 0, patch.width, patch.height);
        const length=STREET_FRONT-STREET_BACK;
        ctx.drawImage(patch,0,h*(SITE_BACK-STREET_BACK)/length,w,h*SITE_LENGTH/length);
      });
    }

    function buildPuddles(parent) {
      const wetMask = new THREE.CanvasTexture(roadWetness());
      wetMask.colorSpace = THREE.SRGBColorSpace;
      wetMask.anisotropy = 8;
      const surface = new THREE.ShaderMaterial({
        transparent:true, depthWrite:false,
        uniforms: {
          wetMask:{value:wetMask}, reflection:{value:null}, reflectionMatrix:{value:new THREE.Matrix4()},rainAmount:{value:0},rainTime:{value:0}
        },
        vertexShader: `
          uniform mat4 reflectionMatrix;
          varying vec4 reflected;
          varying vec2 pavement;
          void main() {
            vec4 world = modelMatrix * vec4(position, 1.0);
            reflected = reflectionMatrix * world;
            pavement = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }`,
        fragmentShader: `
          uniform sampler2D wetMask;
          uniform sampler2D reflection;
          uniform float rainAmount;
          uniform float rainTime;
          varying vec4 reflected;
          varying vec2 pavement;
          void main() {
            float wet = texture2D(wetMask,pavement).a;
            wet=mix(wet,max(wet,0.30),rainAmount);
            wet*=smoothstep(0.0,0.045,pavement.y)*(1.0-smoothstep(0.95,1.0,pavement.y));
            if (wet < 0.009) discard;
            vec2 at = reflected.xy / reflected.w * 0.5 + 0.5;
            if (any(lessThan(at,vec2(0.005))) || any(greaterThan(at,vec2(0.995)))) discard;
            // Broken microfacets spread the reflected signs into brief streaks.
            float ripple = sin(pavement.y * 490.0 + sin(pavement.x * 88.0 + rainTime*rainAmount*1.8) * 1.9) * (0.0014+rainAmount*0.0012);
            vec2 edge = vec2(0.0014 + 0.0015 * wet, 0.0035);
            at += vec2(ripple, ripple * 0.55);
            vec3 color = texture2D(reflection,at).rgb * 0.38;
            color += (texture2D(reflection,at+edge).rgb+texture2D(reflection,at-edge).rgb) * 0.20;
            color += (texture2D(reflection,at+edge*vec2(1.8,-2.0)).rgb+texture2D(reflection,at-edge*vec2(1.8,-2.0)).rgb) * 0.11;
            gl_FragColor = vec4(color * vec3(0.86,0.90,0.97), wet * mix(0.36,0.62,rainAmount));
            #include <tonemapping_fragment>
            #include <colorspace_fragment>
          }`
      });
      const wetBounds={left:ROAD_LEFT,right:ROAD_RIGHT,back:SITE_BACK,front:SITE_FRONT};
      const geometry=groundGrid([ROAD_LEFT,ROAD_CENTER,ROAD_RIGHT],[SITE_BACK,SITE_FRONT],wetBounds,x=>roadHeight(x)+.004);
      const puddles=new THREE.Mesh(geometry,surface);
      puddles.name = 'Wet asphalt reflections';
      parent.add(puddles);
      return puddles;
    }

    function makeRoadReflection(renderer, scene, puddles, camera) {
      const target = new THREE.WebGLRenderTarget(1,1, {type:THREE.HalfFloatType});
      target.scissorTest = true;
      const mirror = camera.clone();
      const aim = new THREE.Vector3();
      const reflectedUp = new THREE.Vector3();
      const projected = new THREE.Vector3();
      const roadCorners=[ROAD_LEFT,ROAD_CENTER,ROAD_RIGHT].flatMap(x=>[SITE_BACK,SITE_FRONT].map(z=>[x,z]));
      const clipping = [new THREE.Plane(new THREE.Vector3(0,1,0),-.050)];
      puddles.material.uniforms.reflection.value = target.texture;

      function cropToRoad(projection) {
        let minX = 1, minY = 1, maxX = -1, maxY = -1;
        for (const [x,z] of roadCorners) {
          projected.set(x,roadHeight(x)+.004,z).applyMatrix4(projection);
          minX = Math.min(minX,projected.x);
          minY = Math.min(minY,projected.y);
          maxX = Math.max(maxX,projected.x);
          maxY = Math.max(maxY,projected.y);
        }
        // The road shader offsets its taps for ripples, so retain a border
        // around the full projection of the receiving surface.
        const border = .012;
        const left = Math.max(0,Math.floor(target.width*(minX*.5+.5-border))-1);
        const bottom = Math.max(0,Math.floor(target.height*(minY*.5+.5-border))-1);
        const right = Math.min(target.width,Math.ceil(target.width*(maxX*.5+.5+border))+1);
        const top = Math.min(target.height,Math.ceil(target.height*(maxY*.5+.5+border))+1);
        if (right <= left || top <= bottom) return false;
        target.scissor.set(left,bottom,right-left,top-bottom);
        return true;
      }

      return {
        resize(width,height) {
          const scale = Math.min(.46,640/width,460/height);
          target.setSize(Math.max(1,Math.round(width*scale)),Math.max(1,Math.round(height*scale)));
        },
        render() {
          if (camera.position.y <= .015) { puddles.visible = false; return; }
          mirror.position.copy(camera.position);
          mirror.position.y = .022 - mirror.position.y;
          camera.getWorldDirection(aim);
          aim.y *= -1;
          reflectedUp.set(0,1,0).applyQuaternion(camera.quaternion);
          reflectedUp.y *= -1;
          mirror.up.copy(reflectedUp);
          mirror.lookAt(aim.add(mirror.position));
          mirror.updateMatrixWorld(true);
          mirror.projectionMatrix.copy(camera.projectionMatrix);
          const projection = puddles.material.uniforms.reflectionMatrix.value;
          projection.multiplyMatrices(mirror.projectionMatrix,mirror.matrixWorldInverse);
          if (!cropToRoad(projection)) { puddles.visible = false; return; }

          const previousTarget = renderer.getRenderTarget();
          const previousClipping = renderer.clippingPlanes;
          const previousShadows = renderer.shadowMap.autoUpdate;
          renderer.clippingPlanes = clipping;
          renderer.shadowMap.autoUpdate = false;
          puddles.visible = false;
          renderer.setRenderTarget(target);
          renderer.render(scene,mirror);
          renderer.setRenderTarget(previousTarget);
          renderer.clippingPlanes = previousClipping;
          renderer.shadowMap.autoUpdate = previousShadows;
          puddles.visible = true;
        }
      };
    }

    // Extend the perimeter haze into a broad layer outside the street. Accumulate
    // density between the camera and the exterior surface.
    const railMistGLSL = `
      float railMistDepth(vec3 surface, vec3 towardCamera, float viewDepth) {
        float outside = abs(surface.x) - atmosphereBounds.x;
        float perimeter = smoothstep(0.0, 4.6, outside);
        if (perimeter <= 0.0) return 0.0;
        float start = atmosphereBounds.x + 1.15;
        float width = railMistEnd - start;
        float total = 0.0;
        for (int side = -1; side <= 1; side += 2) {
          float direction = float(side);
          float x = surface.x * direction;
          float dx = towardCamera.x * direction;
          // Slab limits restrict the samples to the exterior, including views
          // looking almost directly across the tracks.
          float reach = min(viewDepth, 20.0);
          float near = 0.0;
          float far = reach;
          if (abs(dx) > 0.0001) {
            float a = (start - x) / dx;
            float b = (railMistEnd + 5.0 - x) / dx;
            near = max(near, min(a, b));
            far = min(far, max(a, b));
          } else if (x < start || x > railMistEnd + 5.0) {
            continue;
          }
          if (far <= near) continue;
          float stepSize = (far - near) / 8.0;
          float depth = 0.0;
          for (int sampleIndex = 0; sampleIndex < 8; sampleIndex++) {
            vec3 p = surface + towardCamera * (near + (float(sampleIndex) + 0.5) * stepSize);
            float outward = (p.x * direction - start) / width;
            float drift = 0.28 * sin(p.z * 0.32 + p.y * 0.38)
                        + 0.13 * sin(p.z * 0.69 - p.x * 0.23);
            float across = abs(p.z - railMistZ + drift);
            float height = p.y + 0.40 * sin(p.z * 0.23);
            float envelope = (1.0 - smoothstep(3.8, 14.0, across))
                           * (1.0 - smoothstep(8.7, 15.5, height));
            float exterior = clamp(outward, 0.0, 1.15);
            float shoulder = 1.0 - smoothstep(railMistEnd + 2.0, railMistEnd + 5.0, p.x * direction);
            depth += exterior * exterior * envelope * shoulder;
          }
          total += depth * stepSize * 2.7;
        }
        // Keep the distant cut inside the dense part of the layer at grazing angles.
        float deepExterior = smoothstep(0.0, width, outside - 1.15);
        float edgeDepth = 5.0 * deepExterior * deepExterior * deepExterior
                        * (1.0 - smoothstep(4.0, 14.0, abs(surface.z - railMistZ)))
                        * (1.0 - smoothstep(8.7, 15.5, surface.y));
        return total * perimeter + edgeDepth;
      }
    `;

    // Three's default point-light loop evaluates the BRDF even for lights
    // whose attenuation is exactly zero. Reject only fragments beyond range.
    const localLighting = THREE.ShaderChunk.lights_fragment_begin.replace(
      /pointLight = pointLights\[ i \];([\s\S]*?)(\n\t\}\n\t#pragma unroll_loop_end)/,
      `pointLight = pointLights[ i ];
        toPointLight = pointLight.position - geometryPosition;
        if (pointLight.distance <= 0.0 || dot(toPointLight,toPointLight) < pointLight.distance * pointLight.distance) {
          $1
        }$2`
    ).replace('PointLight pointLight;', 'PointLight pointLight;\n\tvec3 toPointLight;');

    const tramLocalLighting=localLighting.replace(
      /(directLight\.color \*= \( directLight\.visible && receiveShadow \) \? )(getShadow\( directionalShadowMap\[ i \],[^\n]*?\))( : 1\.0;)/,
      `#if UNROLLED_LOOP_INDEX == 0
        $1min($2, tramSunVisibility(tramShadowCoord,atmosphereWorld.y,directionalLightShadow.shadowIntensity))$3
      #else
        $1$2$3
      #endif`
    );
    const tramShadowFragment=`
      #if defined( USE_SHADOWMAP ) && NUM_DIR_LIGHT_SHADOWS > 0
        varying vec3 tramShadowCoord;
        uniform highp sampler2DShadow tramDepth;
        uniform vec2 tramShadowScale;
        uniform float tramShadowBias;
        uniform float tramShadowOpacity;
        uniform float tramShadowSoftness;

        float tramSunVisibility(vec3 coord,float height,float intensity) {
          if (tramShadowOpacity < 0.001 || any(lessThan(coord,vec3(0.0))) ||
              any(greaterThan(coord,vec3(1.0)))) return 1.0;
          coord.z -= tramShadowBias;
          // A small fixed tent filter stays in light space as the car moves.
          // Its radius grows on the street below the elevated train.
          float radius=(0.012+0.013*max(0.0,5.22-height))*tramShadowSoftness;
          vec2 stepUV=radius*tramShadowScale;
          float lit=0.0;
          for(int row=-1;row<=1;row++) for(int col=-1;col<=1;col++) {
            vec2 tap=vec2(float(col),float(row));
            float weight=(2.0-abs(tap.x))*(2.0-abs(tap.y));
            lit+=weight*texture(tramDepth,vec3(coord.xy+tap*stepUV,coord.z));
          }
          return mix(1.0,lit/16.0,tramShadowOpacity*intensity);
        }
      #endif
    `;

    function applyAtmosphericFalloff(scene, renderer, tramHeadlightX, occlusion, tramShadows) {
      const viewport = new THREE.Vector2();
      renderer.getDrawingBufferSize(viewport);
      const uniforms = {
        atmosphereSky: {value: scene.background},
        atmosphereSize: {value: viewport},
        atmosphereBounds: {value:new THREE.Vector3(SITE_HALF_WIDTH,SITE_LENGTH/2,SITE_CENTER_Z)},
        atmosphereEnabled: {value: 1},atmosphereRain:{value:0},
        railMistEnd: {value: SITE_HALF_WIDTH + RAIL_APPROACH_LENGTH},
        railMistZ: {value: RAIL_CENTER_Z},
        tramHeadlightX
      };
      const visited = new Set();
      scene.traverse(object => {
        if (!object.isMesh || object.userData.skipAtmosphere) return;
        const materials = Array.isArray(object.material) ? object.material : [object.material];
        for (const finish of materials) {
          if (visited.has(finish) || !(finish.isMeshStandardMaterial || finish.isMeshBasicMaterial)) continue;
          visited.add(finish);
          const previous = finish.onBeforeCompile;
          const cacheKey = finish.customProgramCacheKey();
          const distantNeighborhood=Boolean(finish.userData.distantNeighborhood);
          const railPass = finish.userData.railMistPass;
          const headlightReceiver = finish.userData.headlightReceiver;
          const tramReceiver=Boolean(tramShadows?.receivers.has(finish));
          const receivesTramShadow=Boolean(tramShadows) && finish.isMeshStandardMaterial;
          const occluded = Boolean(occlusion) && finish.isMeshStandardMaterial && !tramReceiver;
          finish.onBeforeCompile = shader => {
            previous.call(finish,shader,renderer);
            Object.assign(shader.uniforms,uniforms);
            if (occluded) Object.assign(shader.uniforms,occlusion);
            if (receivesTramShadow) Object.assign(shader.uniforms,tramShadows.uniforms);
            if (headlightReceiver) shader.uniforms.tramHeadlightStrength = {value:headlightReceiver};
            shader.vertexShader = shader.vertexShader.replace('#include <common>', `
              #include <common>
              varying vec3 atmosphereWorld;
              varying vec2 railMistUV;
              ${receivesTramShadow ? `
                #if defined( USE_SHADOWMAP ) && NUM_DIR_LIGHT_SHADOWS > 0
                  uniform mat4 tramShadowMatrix;
                  varying vec3 tramShadowCoord;
                #endif` : ''}
            `).replace('#include <project_vertex>', `
              #include <project_vertex>
              railMistUV = gl_Position.xy / gl_Position.w * 0.5 + 0.5;
              vec4 atmospherePosition = vec4(transformed,1.0);
              #ifdef USE_BATCHING
                atmospherePosition = batchingMatrix * atmospherePosition;
              #endif
              #ifdef USE_INSTANCING
                atmospherePosition = instanceMatrix * atmospherePosition;
              #endif
              atmosphereWorld = (modelMatrix * atmospherePosition).xyz;
              ${receivesTramShadow ? `
                #if defined( USE_SHADOWMAP ) && NUM_DIR_LIGHT_SHADOWS > 0
                  vec3 tramReceiverNormal=inverseTransformDirection(transformedNormal,viewMatrix);
                  tramShadowCoord=(tramShadowMatrix*vec4(atmosphereWorld+0.014*tramReceiverNormal,1.0)).xyz;
                #endif` : ''}
            `);
            shader.fragmentShader = shader.fragmentShader.replace('#include <lights_fragment_begin>',receivesTramShadow?tramLocalLighting:localLighting).replace('#include <common>', `
              #include <common>
              ${tramReceiver ? '#define TRAM_STABLE_SHADOW 1' : ''}
              varying vec3 atmosphereWorld;
              varying vec2 railMistUV;
              uniform sampler2D atmosphereSky;
              uniform vec2 atmosphereSize;
              uniform vec3 atmosphereBounds;
              uniform float atmosphereEnabled;
              uniform float atmosphereRain;
              uniform float railMistEnd;
              uniform float railMistZ;
              ${headlightReceiver ? 'uniform float tramHeadlightX; uniform float tramHeadlightStrength;' : ''}
              ${railMistGLSL}
              ${receivesTramShadow ? tramShadowFragment : ''}
            `).replace('#include <alphatest_fragment>', `
              ${railPass ? `
                float railExterior = abs(atmosphereWorld.x) - atmosphereBounds.x;
                ${railPass === 'exterior'
                  ? 'if (railExterior <= 1.8 || abs(atmosphereWorld.x) >= railMistEnd) discard;'
                  : 'if (railExterior > 1.8) discard;'}
              ` : ''}
              #include <alphatest_fragment>
            `);
            if (headlightReceiver) {
              shader.fragmentShader = shader.fragmentShader.replace('#include <opaque_fragment>', `
                float ahead = atmosphereWorld.x - tramHeadlightX;
                if (atmosphereRain > 0.001 && ahead > 0.05 && ahead < 5.1 && atmosphereWorld.y > 5.17) {
                  float trackOffset = abs(abs(atmosphereWorld.z-railMistZ)-0.444);
                  float across = trackOffset / (0.13 + ahead * 0.09);
                  float along = smoothstep(0.05,1.2,ahead)*(1.0-smoothstep(1.5,5.1,ahead));
                  float edge = 1.0-smoothstep(railMistEnd-4.0,railMistEnd,abs(atmosphereWorld.x));
                  float glint = along * exp(-2.8*across*across) * edge * atmosphereRain;
                  outgoingLight += vec3(1.0,0.58,0.26) * glint * tramHeadlightStrength;
                }
                #include <opaque_fragment>
              `);
            }
            if (occluded) {
              // Screen-space occlusion from the previous frame, reprojected through
              // that frame's camera. It scales only sky, bounce and reflected light.
              shader.fragmentShader = shader.fragmentShader.replace('#include <common>', `#include <common>
                uniform sampler2D screenOcclusionMap;
                uniform mat4 screenOcclusionViewProjection;
                uniform float screenOcclusionStrength;
              `).replace('#include <aomap_fragment>', `#include <aomap_fragment>
                if (atmosphereEnabled > 0.0 && screenOcclusionStrength > 0.0) {
                  vec4 occlusionClip = screenOcclusionViewProjection * vec4(atmosphereWorld, 1.0);
                  vec2 occlusionUv = clamp(occlusionClip.xy / occlusionClip.w * 0.5 + 0.5, 0.0, 1.0);
                  float screenOcclusion = mix(1.0, texture2D(screenOcclusionMap, occlusionUv).r, screenOcclusionStrength);
                  reflectedLight.indirectDiffuse *= screenOcclusion;
                  reflectedLight.indirectSpecular *= screenOcclusion;
                }
              `);
            }
            shader.fragmentShader = shader.fragmentShader.replace('#include <fog_fragment>', `
              #include <fog_fragment>
              // Low mist thickens toward the perimeter. The same sky texture makes
              // the outer ground and soil dissolve smoothly into the evening air.
              vec2 district = abs(vec2(atmosphereWorld.x/atmosphereBounds.x, (atmosphereWorld.z-atmosphereBounds.z)/atmosphereBounds.y));
              float boundary = max(district.x,district.y);
              // Inside this bound every component of the perimeter fog is zero.
              if (atmosphereEnabled > 0.0 ${distantNeighborhood ? '' : '&& (boundary > 0.68 || atmosphereWorld.y < 0.04)'}) {
                float mistDrift=0.024*sin(atmosphereWorld.x*0.43+atmosphereWorld.z*0.31)+0.015*sin(atmosphereWorld.z*0.73-atmosphereWorld.x*0.19);
                float edgeMist = smoothstep(0.72,1.08,boundary+mistDrift);
                float heightDensity = exp(-max(atmosphereWorld.y-0.17,0.0)*0.87);
                float belowStreet = 1.0-smoothstep(-0.88,0.04,atmosphereWorld.y);
                float outerAir = smoothstep(1.04,2.9,boundary)*mix(0.76,0.91,atmosphereRain);
                float outerGround = smoothstep(0.98,1.19,boundary)*exp(-max(atmosphereWorld.y-0.18,0.0)*2.8);
                float fogWeight = max(max(edgeMist*heightDensity,belowStreet*0.995),outerGround);
                fogWeight = 1.0-(1.0-fogWeight)*(1.0-outerAir);
                ${distantNeighborhood ? 'float neighborhoodHaze=0.74+0.245*smoothstep(1.05,2.35,boundary); fogWeight=1.0-(1.0-fogWeight)*(1.0-neighborhoodHaze);' : ''}
                vec2 pixel = 1.0 / atmosphereSize;
                vec3 skyColor = linearToOutputTexel(textureGrad(atmosphereSky,gl_FragCoord.xy*pixel,
                  vec2(pixel.x,0.0),vec2(0.0,pixel.y))).rgb;
                gl_FragColor.rgb = mix(gl_FragColor.rgb,skyColor,clamp(fogWeight,0.0,1.0));
              }
              float railFogDepth = 0.0;
              if (district.x > 1.0) {
                vec3 towardCamera = vec3(viewMatrix[0].z, viewMatrix[1].z, viewMatrix[2].z);
                float viewDepth = dot(cameraPosition - atmosphereWorld, towardCamera);
                railFogDepth = railMistDepth(atmosphereWorld, towardCamera, viewDepth);
                float railFog = (1.0 - exp(-railFogDepth * 0.19))${railPass ? ' * 0.22' : ''};
                if (railFog >= 0.001) {
                  vec3 mist = linearToOutputTexel(texture2D(atmosphereSky,railMistUV)).rgb;
                  gl_FragColor.rgb = mix(gl_FragColor.rgb,mist,railFog);
                }
              }
              ${railPass === 'exterior' ? `
                float farEnd = railMistEnd - atmosphereBounds.x;
                float reach = smoothstep(1.8, farEnd, railExterior);
                gl_FragColor.a *= exp(-railFogDepth * 0.13 * reach) * (1.0 - reach * reach);
              ` : ''}
            `);
          };
          finish.customProgramCacheKey = () => `${cacheKey}/district-approach-haze/${distantNeighborhood}/${railPass ?? 'default'}/${Boolean(headlightReceiver)}/${occluded}/${receivesTramShadow}/${tramReceiver}`;
          finish.needsUpdate = true;
        }
      });
      return {
        setEnabled(value) {uniforms.atmosphereEnabled.value = value ? 1 : 0;},
        setRain(amount) {uniforms.atmosphereRain.value=amount;},
        resize() {renderer.getDrawingBufferSize(viewport);}
      };
    }

    function buildStreetApproaches(parent,asphalt) {
      const approaches=new THREE.Group();
      approaches.name='Street approaches fading into dusk';
      parent.add(approaches);
      const sidewalk = material('#9d9daa',{roughness:.96});
      for (const [start,end] of [[STREET_BACK,SITE_BACK],[SITE_FRONT,STREET_FRONT]]) {
        const middle = (start+end)/2;
        const road=groundGrid([ROAD_LEFT,ROAD_CENTER,ROAD_RIGHT],[start,end],ROAD_BOUNDS,roadHeight);
        place(approaches,road,asphalt,0,0,0,false);
        for (const x of [ROAD_LEFT-1.6,ROAD_RIGHT+1.6]) {
          block(approaches,sidewalk,x,.075,middle,3.2,.15,end-start,false);
        }
        for(const x of [ROAD_LEFT-.08,ROAD_RIGHT+.08]) {
          block(approaches,sidewalk,x,.10,middle,.16,.20,end-start,false);
        }
      }
      // Thin apron around the district continues the pavement beneath the mist.
      for (const x of [SITE_HALF_WIDTH+2.4]) {
        const apron = place(approaches,new THREE.PlaneGeometry(4.8,SITE_LENGTH),sidewalk,x,-.025,SITE_CENTER_Z,false);
        apron.rotation.x = -Math.PI/2;
      }
      // Continue the suburban plots under the mist so lanes and front gates share a ground plane.
      for(const [x,z,w,d] of [[-23,SITE_CENTER_Z,18,SITE_LENGTH],[-16.8,SITE_BACK-12.5,26.36,25],[15.53,SITE_BACK-12.5,14.94,25]]) {
        const lane=place(approaches,new THREE.PlaneGeometry(w,d),sidewalk,x,-.025,z,false);
        lane.rotation.x=-Math.PI/2;
      }
      approaches.traverse(mesh=>{if(mesh.isMesh)mesh.receiveShadow=false;});
    }

    function buildContactShadows(parent) {
      const contact = paintedTexture(128,128,(ctx,w,h) => {
        // Rectangle edges are blurred, with denser occlusion just beneath the wall.
        const image = ctx.createImageData(w,h);
        for (let y=0;y<h;y++) for (let x=0;x<w;x++) {
          const edge = Math.max(Math.abs(x/w-.5)*2,Math.abs(y/h-.5)*2);
          const alpha = Math.pow(Math.max(0,1-Math.pow(edge,5)),1.4)*.34;
          const i=(y*w+x)*4;
          image.data[i]=20; image.data[i+1]=25; image.data[i+2]=39; image.data[i+3]=alpha*255;
        }
        ctx.putImageData(image,0,0);
      });
      const finish = new THREE.MeshBasicMaterial({map:contact,transparent:true,depthWrite:false});
      for (const [x,z,w,d] of [[-5.65,4.35,5.36,5.28],[-9.1,10.9,6.2,5.8],[-10.45,-11.2,4.4,7.4],[9.55,-11.75,5.35,6.3],[-5.42,-11.39,5.44,7.9],[-4.25,-3.2,6.1,3.3],[10.65,5.12,3.6,3.7],[-10.59,1.84,4.05,4.84]]) {
        const shadow=place(parent,new THREE.PlaneGeometry(w,d),finish,x,.179,z,false);
        shadow.rotation.x=-Math.PI/2;
      }
    }

    // Final grade. Scattered light from the screen-space lighting pass is added in
    // linear HDR before tone mapping, and an 8-bit dither removes banding from the
    // long dusk gradients in the sky and mist.
    function createFilmOutputPass() {
      const material = new THREE.ShaderMaterial({
        uniforms: {
          tDiffuse:{value:null},
          tAir:{value:null},
          airReady:{value:0},
          sunAirColor:{value:new THREE.Color(0,0,0)},
          lampAirColor:{value:new THREE.Color(0,0,0)},
          shadowLift:{value:new THREE.Color(0.006,0.008,0.012)},
          coolShadows:{value:0.36},
          warmHighlights:{value:0.55}
        },
        vertexShader: `varying vec2 vUv;
          void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
        fragmentShader: `uniform sampler2D tDiffuse;
          uniform sampler2D tAir;
          uniform float airReady;
          uniform vec3 sunAirColor;
          uniform vec3 lampAirColor;
          uniform vec3 shadowLift;
          uniform float coolShadows;
          uniform float warmHighlights;
          varying vec2 vUv;
          float filmNoise(vec2 p){return fract(52.9829189*fract(dot(p,vec2(0.06711056,0.00583715))));}
          void main(){
            vec4 image=texture2D(tDiffuse,vUv);
            if(airReady>0.5){
              vec3 air=texture2D(tAir,vUv).rgb;
              image.rgb+=air.g*sunAirColor+air.b*lampAirColor;
            }
            float luma=dot(image.rgb,vec3(0.2126,0.7152,0.0722));
            vec3 color=mix(vec3(luma),image.rgb,0.99);
            float shadows=1.0-smoothstep(0.035,0.65,luma);
            float highlights=smoothstep(0.65,2.8,luma);
            color+=shadowLift*(1.0-smoothstep(0.0,0.22,luma));
            color*=mix(vec3(1.0),vec3(0.985,1.0,1.03),shadows*coolShadows);
            color*=mix(vec3(1.0),vec3(1.045,1.006,0.958),highlights*warmHighlights);
            vec2 edge=vUv-0.5;
            float vignette=1.0-0.085*smoothstep(0.16,0.58,dot(edge,edge));
            gl_FragColor=vec4(max(color,vec3(0.0))*vignette,image.a);
            #include <tonemapping_fragment>
            #include <colorspace_fragment>
            gl_FragColor.rgb+=(filmNoise(gl_FragCoord.xy)-0.5)/255.0;
          }`,
        depthTest:false,
        depthWrite:false
      });
      const pass = new ShaderPass(material);
      pass.needsSwap = false;
      return pass;
    }

    // ---------------------------------------------------------------------------
    // Contact-hardening sun shadows. A low evening sun is a broad, slightly hazy
    // disc, so a shadow stays crisp where a post meets the pavement and softens
    // with distance from the caster. sun.shadow.radius now scales the apparent
    // size of the disc, which lets the overcast rain state blur every shadow.
    const SUN_DISC_RADIUS = .85;      // degrees, about three suns in the damp air
    const SUN_MAX_PENUMBRA = .95;     // world units

    function vogelDisk(count) {
      const points = [];
      for (let i = 0; i < count; i++) {
        const radius = Math.sqrt((i + .5) / count);
        const angle = i * 2.39996323;
        points.push(`vec2(${(Math.cos(angle)*radius).toFixed(6)},${(Math.sin(angle)*radius).toFixed(6)})`);
      }
      return `vec2[${count}](${points.join(',')})`;
    }

    function installSoftSunShadows(shadowCamera, mapSize) {
      const chunk = THREE.ShaderChunk.shadowmap_pars_fragment;
      const pcf = /#if defined\( SHADOWMAP_TYPE_PCF \)\s+vec2 texelSize = vec2\( 1\.0 \) \/ shadowMapSize;[\s\S]*?\* \( 1\.0 \/ 17\.0 \);/;
      if (!pcf.test(chunk) || chunk.split('float getShadow(').length !== 2) {
        console.warn('Soft sun shadows unavailable: unexpected shadow chunk, keeping PCF.');
        return false;
      }
      const width = shadowCamera.right - shadowCamera.left;
      const height = shadowCamera.top - shadowCamera.bottom;
      const depthRange = shadowCamera.far - shadowCamera.near;
      const texel = Math.max(width, height) / mapSize;
      const functions = `
        const vec2 SOFT_SUN_UV = vec2(${(1/width).toFixed(8)}, ${(1/height).toFixed(8)});
        const float SOFT_SUN_DEPTH = ${depthRange.toFixed(4)};
        const float SOFT_SUN_SPREAD = ${Math.tan(THREE.MathUtils.degToRad(SUN_DISC_RADIUS)).toFixed(6)};
        const float SOFT_SUN_MIN = ${(texel*1.2).toFixed(5)};
        const float SOFT_SUN_MAX = ${SUN_MAX_PENUMBRA.toFixed(4)};
        const float SOFT_SUN_EPSILON = ${(.012/depthRange).toFixed(7)};
        const vec2 SOFT_SUN_DISK[16] = ${vogelDisk(16)};

        float softSunNoise() {
          return fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
        }

        float softSunShadow(sampler2D shadowMap, vec3 coord, float softness) {
          // Depth gradient of the receiving surface in shadow-map space, so samples
          // spread across sloped ground are compared against that slope.
          vec3 ddxCoord = dFdx(coord);
          vec3 ddyCoord = dFdy(coord);
          float det = ddxCoord.x * ddyCoord.y - ddyCoord.x * ddxCoord.y;
          vec2 slope = abs(det) > 1e-14
            ? vec2(ddyCoord.y * ddxCoord.z - ddxCoord.y * ddyCoord.z,
                   ddxCoord.x * ddyCoord.z - ddyCoord.x * ddxCoord.z) / det
            : vec2(0.0);
          slope = clamp(slope, vec2(-8.0), vec2(8.0));
          #ifdef TRAM_STABLE_SHADOW
            float angle = 0.617;
          #else
            float angle = 6.2831853 * softSunNoise();
          #endif
          mat2 spin = mat2(cos(angle), sin(angle), -sin(angle), cos(angle));
          float spread = SOFT_SUN_SPREAD * max(softness, 0.05);

          // Blocker search over the widest penumbra this receiver could have.
          vec2 search = clamp(coord.z * SOFT_SUN_DEPTH * spread, SOFT_SUN_MIN, SOFT_SUN_MAX) * SOFT_SUN_UV;
          float blockerDepth = 0.0;
          float blockers = 0.0;
          for (int i = 0; i < 16; i++) {
            vec2 offset = (spin * SOFT_SUN_DISK[i]) * search;
            float occluder = unpackRGBAToDepth(texture2D(shadowMap, coord.xy + offset));
            if (occluder < coord.z + dot(slope, offset) - SOFT_SUN_EPSILON) {
              blockerDepth += occluder;
              blockers += 1.0;
            }
          }
          if (blockers < 0.5) return 1.0;
          if (blockers > 15.5) return 0.0;

          float penumbra = clamp((coord.z - blockerDepth / blockers) * SOFT_SUN_DEPTH * spread, SOFT_SUN_MIN, SOFT_SUN_MAX);
          vec2 filterRadius = penumbra * SOFT_SUN_UV;
          float lit = 0.0;
          for (int i = 0; i < 16; i++) {
            vec2 offset = (spin * SOFT_SUN_DISK[i]) * filterRadius;
            lit += step(coord.z + dot(slope, offset) - SOFT_SUN_EPSILON,
              unpackRGBAToDepth(texture2D(shadowMap, coord.xy + offset)));
          }
          return lit * (1.0 / 16.0);
        }
      `;
      THREE.ShaderChunk.shadowmap_pars_fragment = chunk
        .replace('float getShadow(', `${functions}\n\tfloat getShadow(`)
        .replace(pcf, '#if defined( SHADOWMAP_TYPE_PCF )\n\t\t\tshadow = softSunShadow( shadowMap, shadowCoord.xyz, shadowRadius );');
      return true;
    }

    function createTramShadows(renderer,train,sun) {
      if (tramLocalLighting===localLighting) return null;
      train.updateWorldMatrix(true,true);
      const localWorld=train.matrixWorld.clone().invert();
      const casters=new THREE.Scene();
      const receivers=new Set();
      const originals=[];
      const depthMaterial=new THREE.MeshDepthMaterial({side:THREE.DoubleSide,colorWrite:false});
      train.traverse(object=>{
        if (!object.isMesh) return;
        for (const finish of Array.isArray(object.material)?object.material:[object.material]) receivers.add(finish);
        if (!object.castShadow) return;
        const proxy=object.isInstancedMesh
          ? new THREE.InstancedMesh(object.geometry,depthMaterial,object.count)
          : new THREE.Mesh(object.geometry,depthMaterial);
        if (object.isInstancedMesh) proxy.instanceMatrix=object.instanceMatrix;
        proxy.matrixAutoUpdate=false;
        proxy.matrix.multiplyMatrices(localWorld,object.matrixWorld);
        casters.add(proxy);
        originals.push(object);
      });
      if (!originals.length) {
        depthMaterial.dispose();
        return null;
      }
      const bounds=new THREE.Box3().setFromObject(casters);
      const center=bounds.getCenter(new THREE.Vector3());
      const worldSun=sun.getWorldPosition(new THREE.Vector3()).sub(sun.target.getWorldPosition(new THREE.Vector3())).normalize();
      const localSun=worldSun.clone().transformDirection(localWorld);
      const camera=new THREE.OrthographicCamera();
      camera.position.copy(center).addScaledVector(localSun,22);
      camera.lookAt(center);
      camera.updateMatrixWorld(true);
      const projected=new THREE.Box3();
      const corner=new THREE.Vector3();
      for (const x of [bounds.min.x,bounds.max.x]) {
        for (const y of [bounds.min.y,bounds.max.y]) {
          for (const z of [bounds.min.z,bounds.max.z]) {
            projected.expandByPoint(corner.set(x,y,z).applyMatrix4(camera.matrixWorldInverse));
          }
        }
      }
      const extra=.28;
      Object.assign(camera,{
        left:projected.min.x-extra,right:projected.max.x+extra,
        bottom:projected.min.y-extra,top:projected.max.y+extra,
        near:Math.max(.1,-projected.max.z-.5),
        far:-projected.min.z+(bounds.max.y+BASE_DEPTH+1)/Math.max(localSun.y,.12)
      });
      camera.updateProjectionMatrix();
      const spanX=camera.right-camera.left,spanY=camera.top-camera.bottom;
      const size=Math.min(renderer.capabilities.maxTextureSize,matchMedia('(pointer:coarse)').matches?960:1280);
      const pixelScale=size/Math.max(spanX,spanY);
      const width=Math.ceil(spanX*pixelScale),height=Math.ceil(spanY*pixelScale);
      const depth=new THREE.DepthTexture(width,height,THREE.UnsignedIntType);
      depth.name='Tram-space sunlight depth';
      depth.minFilter=depth.magFilter=THREE.LinearFilter;
      depth.compareFunction=THREE.LessEqualCompare;
      const target=new THREE.WebGLRenderTarget(width,height,{depthTexture:depth});
      const localProjection=new THREE.Matrix4().set(
        .5,0,0,.5, 0,.5,0,.5, 0,0,.5,.5, 0,0,0,1
      ).multiply(camera.projectionMatrix).multiply(camera.matrixWorldInverse);

      // Bake once in the car's coordinate system. Translation only changes
      // the lookup matrix. The street keeps its original static sun map.
      const uniforms={
        tramDepth:{value:depth},
        tramShadowMatrix:{value:new THREE.Matrix4()},
        tramShadowScale:{value:new THREE.Vector2(1/spanX,1/spanY)},
        tramShadowBias:{value:.007/(camera.far-camera.near)},
        tramShadowOpacity:{value:0},
        tramShadowSoftness:{value:1}
      };
      const edge=SITE_HALF_WIDTH+RAIL_APPROACH_LENGTH;
      const halfLength=(bounds.max.x-bounds.min.x)/2;
      for (const object of originals) object.castShadow=false;
      let dirty=true;
      return {
        receivers,uniforms,
        update(rain) {
          localWorld.copy(train.matrixWorld).invert();
          uniforms.tramShadowMatrix.value.multiplyMatrices(localProjection,localWorld);
          // The visible body is clipped at the foggy ends of the route.
          const fade=THREE.MathUtils.smoothstep(Math.abs(train.position.x),edge-halfLength,edge+halfLength);
          uniforms.tramShadowOpacity.value=train.visible?1-fade:0;
          uniforms.tramShadowSoftness.value=THREE.MathUtils.lerp(1,2.1,rain);
          if (!dirty) return;
          const previous=renderer.getRenderTarget();
          const clipping=renderer.clippingPlanes;
          const shadows=renderer.shadowMap.enabled,clear=renderer.autoClear;
          renderer.clippingPlanes=[];
          renderer.shadowMap.enabled=false;
          renderer.autoClear=false;
          try {
            renderer.setRenderTarget(target);
            renderer.clearDepth();
            renderer.render(casters,camera);
            dirty=false;
          } finally {
            renderer.setRenderTarget(previous);
            renderer.autoClear=clear;
            renderer.clippingPlanes=clipping;
            renderer.shadowMap.enabled=shadows;
          }
        },
        invalidate(){dirty=true;},
        dispose(){target.dispose();depthMaterial.dispose();}
      };
    }

    // ---------------------------------------------------------------------------
    // Screen-space light transport, computed from the main pass depth buffer.
    // A half-resolution gather pass estimates three things at once:
    //   r  ambient occlusion of sky and bounce light,
    //   g  sunlight scattered by the damp evening air, raymarched through the
    //      sun's shadow map so the rail bridge and rooftops cast light shafts,
    //   b  glow of the street lamps in the same air (closed-form in-scatter).
    // Two edge-aware blurs and a depth-guided upsample follow. Lit materials read
    // the occlusion term on the next frame through reprojection, so it darkens
    // only indirect light, never the sun or the lamps. The film pass adds the
    // scattered light in linear HDR.
    const FULLSCREEN_VERTEX = `varying vec2 vUv;
      void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`;

    function createScreenSpaceLighting({camera, sun, occlusion, lamps, bounds}) {
      const lampCount = Math.min(lamps.length, 12);
      const halfTarget = () => new THREE.WebGLRenderTarget(1, 1, {
        type:THREE.HalfFloatType, depthBuffer:false, generateMipmaps:false,
        minFilter:THREE.NearestFilter, magFilter:THREE.NearestFilter
      });
      const gathered = halfTarget();
      const blurred = halfTarget();
      const resolved = new THREE.WebGLRenderTarget(1, 1, {
        type:THREE.HalfFloatType, depthBuffer:false, generateMipmaps:false,
        minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter
      });
      const fullSize = new THREE.Vector2(1, 1);
      const halfSize = new THREE.Vector2(1, 1);
      const projection = new THREE.Matrix4();
      const projectionInverse = new THREE.Matrix4();

      const lampSpheres = [];
      const lampPowers = [];
      for (const lamp of lamps.slice(0, lampCount)) {
        lampSpheres.push(new THREE.Vector4(lamp.position.x, lamp.position.y, lamp.position.z, lamp.range));
        lampPowers.push(lamp.power);
      }

      const gatherMaterial = new THREE.ShaderMaterial({
        defines:{LAMP_COUNT:lampCount, AO_SAMPLES:16, SUN_STEPS:24},
        uniforms:{
          tDepth:{value:null},
          tShadow:{value:null},
          shadowReady:{value:0},
          shadowMatrix:{value:new THREE.Matrix4()},
          fullSize:{value:fullSize},
          cameraProjection:{value:projection},
          cameraProjectionInverse:{value:projectionInverse},
          cameraWorld:{value:camera.matrixWorld},
          aoRadius:{value:.62},
          aoIntensity:{value:1.0},
          sunAir:{value:1},
          hazeFalloff:{value:.26},
          volumeMin:{value:bounds.min.clone()},
          volumeMax:{value:bounds.max.clone()},
          lampSpheres:{value:lampSpheres},
          lampPowers:{value:lampPowers}
        },
        vertexShader:FULLSCREEN_VERTEX,
        fragmentShader:`
          #include <packing>
          uniform sampler2D tDepth;
          uniform sampler2D tShadow;
          uniform float shadowReady;
          uniform mat4 shadowMatrix;
          uniform vec2 fullSize;
          uniform mat4 cameraProjection;
          uniform mat4 cameraProjectionInverse;
          uniform mat4 cameraWorld;
          uniform float aoRadius;
          uniform float aoIntensity;
          uniform float sunAir;
          uniform float hazeFalloff;
          uniform vec3 volumeMin;
          uniform vec3 volumeMax;
          #if LAMP_COUNT > 0
            uniform vec4 lampSpheres[LAMP_COUNT];
            uniform float lampPowers[LAMP_COUNT];
          #endif
          varying vec2 vUv;

          // Positions are rebuilt at exact depth-texel centres; half-resolution
          // pixel centres fall between texels and would tilt flat walls.
          vec2 snapToTexel(vec2 uv) {
            return (floor(uv * fullSize) + 0.5) / fullSize;
          }
          vec3 viewAt(vec2 uv, float depth) {
            vec4 p = cameraProjectionInverse * vec4(vec3(uv, depth) * 2.0 - 1.0, 1.0);
            return p.xyz / p.w;
          }
          vec3 viewAt(vec2 uv) {
            vec2 texelUv = snapToTexel(uv);
            return viewAt(texelUv, texture2D(tDepth, texelUv).x);
          }
          float screenNoise(vec2 p) {
            return fract(52.9829189 * fract(dot(p, vec2(0.06711056, 0.00583715))));
          }

          void main() {
            vec2 uv = snapToTexel(vUv);
            float depth = texture2D(tDepth, uv).x;
            vec3 P = viewAt(uv, depth);
            bool open = depth >= 0.999999;
            float jitter = screenNoise(gl_FragCoord.xy);
            float spin = 6.2831853 * screenNoise(gl_FragCoord.yx + vec2(37.0, 11.0));

            // Ambient occlusion (scalable ambient obscurance over a spiral disc).
            float occlusion = 1.0;
            if (!open && aoIntensity > 0.0) {
              vec2 texel = 1.0 / fullSize;
              vec3 right = viewAt(uv + vec2(texel.x, 0.0));
              vec3 left = viewAt(uv - vec2(texel.x, 0.0));
              vec3 above = viewAt(uv + vec2(0.0, texel.y));
              vec3 below = viewAt(uv - vec2(0.0, texel.y));
              vec3 ddxP = abs(right.z - P.z) < abs(P.z - left.z) ? right - P : P - left;
              vec3 ddyP = abs(above.z - P.z) < abs(P.z - below.z) ? above - P : P - below;
              vec3 N = normalize(cross(ddxP, ddyP));
              vec2 disc = vec2(cameraProjection[0][0], cameraProjection[1][1]) * 0.5 * aoRadius;
              float radius2 = aoRadius * aoRadius;
              float sum = 0.0;
              for (int i = 0; i < AO_SAMPLES; i++) {
                float along = (float(i) + jitter) / float(AO_SAMPLES);
                float angle = spin + float(i) * 2.3999632;
                vec3 v = viewAt(uv + vec2(cos(angle), sin(angle)) * along * disc) - P;
                float vv = dot(v, v);
                float falloff = max(radius2 - vv, 0.0) / radius2;
                sum += falloff * falloff * max(dot(v, N) - 0.004, 0.0) / (vv + 0.004) * aoRadius;
              }
              occlusion = clamp(1.0 - aoIntensity * sum / float(AO_SAMPLES), 0.0, 1.0);
            }

            vec3 rayDir = normalize((cameraWorld * vec4(0.0, 0.0, -1.0, 0.0)).xyz);
            vec3 rayOrigin = (cameraWorld * vec4(P.xy, 0.0, 1.0)).xyz;
            float rayLength = -P.z;

            // Sunlight scattered along the view ray inside the street volume.
            float sunScatter = 0.0;
            if (sunAir > 0.0 && shadowReady > 0.5) {
              vec3 safeDir = mix(rayDir, vec3(1e-6), vec3(equal(rayDir, vec3(0.0))));
              vec3 inverseDir = 1.0 / safeDir;
              vec3 nearHit = (volumeMin - rayOrigin) * inverseDir;
              vec3 farHit = (volumeMax - rayOrigin) * inverseDir;
              vec3 entry = min(nearHit, farHit);
              vec3 exit = max(nearHit, farHit);
              float t0 = max(max(entry.x, entry.y), max(entry.z, 0.0));
              float t1 = min(min(exit.x, exit.y), min(exit.z, rayLength));
              if (t1 > t0) {
                float stepLength = (t1 - t0) / float(SUN_STEPS);
                float t = t0 + stepLength * jitter;
                for (int i = 0; i < SUN_STEPS; i++) {
                  vec3 q = rayOrigin + rayDir * t;
                  vec4 s = shadowMatrix * vec4(q, 1.0);
                  float lit = 1.0;
                  if (s.x > 0.0 && s.x < 1.0 && s.y > 0.0 && s.y < 1.0 && s.z < 1.0) {
                    lit = step(s.z - 0.0015, unpackRGBAToDepth(texture2D(tShadow, s.xy)));
                  }
                  // Thin the haze toward the open edges of the street volume.
                  vec2 inside = min(q.xz - volumeMin.xz, volumeMax.xz - q.xz);
                  float edge = smoothstep(0.0, 3.0, min(inside.x, inside.y));
                  sunScatter += lit * edge * exp(-max(q.y, 0.0) * hazeFalloff);
                  t += stepLength;
                }
                sunScatter *= stepLength;
              }
            }

            // Lamp light scattered by the same air: the in-scatter integral of an
            // inverse-square source along a straight ray has a closed form.
            float lampScatter = 0.0;
            #if LAMP_COUNT > 0
              for (int i = 0; i < LAMP_COUNT; i++) {
                vec3 toLamp = lampSpheres[i].xyz - rayOrigin;
                float range = lampSpheres[i].w;
                float closest = dot(toLamp, rayDir);
                float h2 = max(dot(toLamp, toLamp) - closest * closest, 0.0036);
                float chord = range * range - h2;
                if (chord > 0.0) {
                  chord = sqrt(chord);
                  float a = max(closest - chord, 0.0);
                  float b = min(closest + chord, rayLength);
                  if (b > a) {
                    float h = sqrt(h2);
                    float window = 1.0 - h2 / (range * range);
                    lampScatter += lampPowers[i] * window * window * (atan((b - closest) / h) - atan((a - closest) / h)) / h;

            gl_FragColor = vec4(occlusion, sunScatter, lampScatter, rayLength);
          }`,
        depthTest:false,
        depthWrite:false
      });

      const blurMaterial = new THREE.ShaderMaterial({
        uniforms:{tInput:{value:null}, step:{value:new THREE.Vector2()}},
        vertexShader:FULLSCREEN_VERTEX,
        fragmentShader:`
          uniform sampler2D tInput;
          uniform vec2 step;
          varying vec2 vUv;
          void main() {
            vec4 center = texture2D(tInput, vUv);
            float depth = center.a;
            float forward = texture2D(tInput, vUv + step).a - depth;
            float backward = depth - texture2D(tInput, vUv - step).a;
            // Follow the local depth slope, so tilted ground blurs while edges hold.
            float slope = abs(forward) < abs(backward) ? forward : backward;
            float tolerance = 0.08 + depth * 0.006;
            vec3 sum = center.rgb;

      const resolveMaterial = new THREE.ShaderMaterial({
        uniforms:{
          tHalf:{value:null}, tDepth:{value:null}, halfSize:{value:halfSize},
          cameraProjectionInverse:{value:projectionInverse}
        },
        vertexShader:FULLSCREEN_VERTEX,
        fragmentShader:`
          uniform sampler2D tHalf;
          uniform sampler2D tDepth;
          uniform vec2 halfSize;
          uniform mat4 cameraProjectionInverse;
          varying vec2 vUv;
          void main() {
            float depth = texture2D(tDepth, vUv).x;
            vec4 p = cameraProjectionInverse * vec4(vec3(vUv, depth) * 2.0 - 1.0, 1.0);
            float viewDepth = -p.z / p.w;
            vec2 position = vUv * halfSize - 0.5;
            vec2 base = floor(position);
            vec2 f = position - base;
            float tolerance = 0.1 + viewDepth * 0.008;
            vec4 result = vec4(0.0);
            float total = 0.0;
            for (int j = 0; j < 2; j++) {
              for (int i = 0; i < 2; i++) {
                vec2 cell = base + vec2(float(i), float(j));
                vec4 s = texture2D(tHalf, (cell + 0.5) / halfSize);
                float bilinear = (i == 0 ? 1.0 - f.x : f.x) * (j == 0 ? 1.0 - f.y : f.y);
                float w = bilinear * exp(-abs(s.a - viewDepth) / tolerance) + 1e-4 * bilinear;

          }`,
        depthTest:false,
        depthWrite:false
      });

      const quad = new FullScreenQuad(gatherMaterial);
      const sunDirection = new THREE.Vector3();
      const forward = new THREE.Vector3();
      const viewProjection = new THREE.Matrix4();
      const lastViewProjection = new THREE.Matrix4();
      const sameView = (a, b) => a.elements.every((value, index) => Math.abs(value - b.elements[index]) < 1e-7);
      const settings = {occlusion:.92, aoPower:2.2, aoRadius:.7, sunAir:.0062, lampAir:.010, hazeFalloff:.30, phase:.58};

      class ScreenLightingPass extends Pass {
        constructor() {
          super();
          this.needsSwap = false;
          this.valid = false;
          this.dirty = true;
          this.film = null;
        }
        // Called when the sun's shadow map or the weather changes.
        invalidate() {
          this.dirty = true;
        }
        setSize(width, height) {
          fullSize.set(width, height);
          halfSize.set(Math.max(1, Math.ceil(width / 2)), Math.max(1, Math.ceil(height / 2)));
          gathered.setSize(halfSize.x, halfSize.y);
          blurred.setSize(halfSize.x, halfSize.y);
          resolved.setSize(width, height);
          // Until a new frame resolves, keep materials from reading stale occlusion.
          this.valid = false;
          occlusion.screenOcclusionStrength.value = 0;
        }
        render(renderer, writeBuffer, readBuffer) {
          // The composer renders the scene into its read buffer; that buffer's
          // depth texture is the one holding this frame's depth.
          const depth = readBuffer.depthTexture;
          if (!depth) {
            this.valid = false;
            occlusion.screenOcclusionStrength.value = 0;
            if (this.film) this.film.uniforms.airReady.value = 0;
            return;
          }
          // A still camera over unchanged shadows gives the same result, so the
          // previous frame's buffers are reused while the tram idles or the view rests.
          viewProjection.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
          if (this.valid && !this.dirty && sameView(viewProjection, lastViewProjection)) {
            this.updateFilm();
            return;
          }
          lastViewProjection.copy(viewProjection);
          this.dirty = false;
          const shadow = sun.shadow.map;
          const uniforms = gatherMaterial.uniforms;
          uniforms.tDepth.value = depth;
          resolveMaterial.uniforms.tDepth.value = depth;
          uniforms.aoRadius.value = settings.aoRadius;
          uniforms.tShadow.value = shadow ? shadow.texture : null;
          uniforms.shadowReady.value = shadow ? 1 : 0;
          uniforms.shadowMatrix.value.copy(sun.shadow.matrix);
          projection.copy(camera.projectionMatrix);
          projectionInverse.copy(camera.projectionMatrixInverse);
          uniforms.aoIntensity.value = settings.occlusion > 0 ? settings.aoPower : 0;
          uniforms.sunAir.value = settings.sunAir > 1e-5 && sun.intensity > .05 ? 1 : 0;
          uniforms.hazeFalloff.value = settings.hazeFalloff;

          quad.material = gatherMaterial;
          renderer.setRenderTarget(gathered);
          quad.render(renderer);
          quad.material = blurMaterial;
          blurMaterial.uniforms.tInput.value = gathered.texture;
          blurMaterial.uniforms.step.value.set(1 / halfSize.x, 0);
          renderer.setRenderTarget(blurred);
          quad.render(renderer);
          blurMaterial.uniforms.tInput.value = blurred.texture;
          blurMaterial.uniforms.step.value.set(0, 1 / halfSize.y);
          renderer.setRenderTarget(gathered);
          quad.render(renderer);
          quad.material = resolveMaterial;
          resolveMaterial.uniforms.tHalf.value = gathered.texture;
          renderer.setRenderTarget(resolved);
          quad.render(renderer);

          // The next frame's materials reproject into this frame's occlusion.
          occlusion.screenOcclusionMap.value = resolved.texture;
          occlusion.screenOcclusionViewProjection.value.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
          occlusion.screenOcclusionStrength.value = settings.occlusion;
          this.valid = true;
          this.updateFilm();
        }
        updateFilm() {
          if (this.film) {
            const film = this.film.uniforms;
            film.tAir.value = resolved.texture;
            film.airReady.value = 1;
            // Henyey-Greenstein phase: damp air throws light forward, so the
            // shafts brighten as the view turns toward the low sun.
            sunDirection.copy(sun.position).sub(sun.target.position).normalize();
            camera.getWorldDirection(forward);
            const g = settings.phase;
            const cosine = sunDirection.dot(forward);
            const phase = (1 - g*g) / (4*Math.PI*Math.pow(1 + g*g - 2*g*cosine, 1.5));
            film.sunAirColor.value.copy(sun.color).multiplyScalar(sun.intensity * phase * settings.sunAir * 4 * Math.PI);
            film.lampAirColor.value.copy(LAMP_AIR_TINT).multiplyScalar(settings.lampAir);
          }
        }
        dispose() {
          gathered.dispose(); blurred.dispose(); resolved.dispose();
          gatherMaterial.dispose(); blurMaterial.dispose(); resolveMaterial.dispose(); quad.dispose();
        }
      }

      return {
        pass,
        settings,
        get texture() { return resolved.texture; },

    // Outdoor practicals whose light visibly scatters in the damp air. Interior

    function collectAirLamps(scene) {

      scene.updateMatrixWorld(true);
      scene.traverse(light => {
        if (!light.isPointLight || !light.userData.airGlow) return;
        lamps.push({
          position:light.getWorldPosition(new THREE.Vector3()),
          range:light.distance,
          power:light.intensity * light.userData.airGlow / (4 * Math.PI)

    }

    function buildSurroundings(scene) {
      const district = new THREE.Group();
      district.name = 'Residential lanes in the evening mist';

      const finish = new THREE.MeshBasicMaterial({color: 0xffffff});
      finish.userData.distantNeighborhood = true;
      const batches = {
        box: {geometry: new THREE.BoxGeometry(), instances: []},
        stem: {geometry: new THREE.CylinderGeometry(.76, 1, 1, 7), instances: []},
        crown: {geometry: new THREE.IcosahedronGeometry(1, 1), instances: []}
      };
      const stamp = new THREE.Object3D();
      const up = new THREE.Vector3(0, 1, 0);
      const roofPositions = [];
      const roofColors = [];
      const earth = -.028;
      const concrete = 0x778498;
      const windowFrame = 0x576982;
      const darkGlass = 0x697d99;
      const warmGlass = 0xcfa697;
      const warmCurtain = 0xb1989f;
      const poleColor = 0x657088;
      const wireColor = 0x65738d;

      function save(batch, color) {

      function crown(color, x, y, z, width, height, depth, angle) {

      function house({x, z, w, d, eaves, rise, roof, wall, tile, turn = 0, lit = -1}) {

        const sin = Math.sin(turn);
        const point = (u, v, t) => [x + u*cos + t*sin, v, z + t*cos - u*sin];
        const piece = (color, u, v, t, width, height, depth) => {
          box(color, point(u, v, t), [width, height, depth], turn);

          for (let i = 0; i < 3; i++) roofColors.push(color.r, color.g, color.b);
        }

          triangle(a, b, c, color);

            point(width/2, y, -depth/2), point(-width/2, y, -depth/2)

        }
        function slopes(base, top, colors) {
          for (let i = 0; i < 4; i++) {
            const next = (i + 1) % 4;

          }
        }

        const wallTone = new THREE.Color(wall);
        const wallShade = wallTone.clone().multiplyScalar(.83);
        const wallShades = [wallTone, wallShade, wallShade, wallTone];
        const roofTone = new THREE.Color(tile);
        const roofShades = [1.08, .87, 1, .95].map(factor => roofTone.clone().multiplyScalar(factor));
        const trim = wallTone.clone().lerp(roofTone, .52);
        const ridgeY = eaves + rise;
        piece(concrete, 0, earth + .115, 0, w + .13, .23, d + .13);
        slopes(ring(w, d, .12), ring(w, d, eaves), wallShades);
        piece(trim, 0, eaves - .045, 0, w + .28, .12, d + .28);

        if (roof === 'flat') {
          piece(tile, 0, eaves + .05, 0, w + .28, .13, d + .28);
          for (const side of [-1, 1]) {
            piece(trim, 0, eaves + .16, side*(d/2 + .09), w + .28, .13, .10);
            piece(trim, side*(w/2 + .09), eaves + .16, 0, .10, .13, d + .09);
          }
          piece(wallShade, -w*.24, eaves + rise/2, -d*.20, w*.24, rise, d*.26);
          piece(roofTone, -w*.24, ridgeY, -d*.20, w*.27, .07, d*.29);
        } else {
          const roofWidth = w + .50;
          const roofDepth = d + .56;
          const isGabled = roof === 'gable';
          const ridgeWidth = isGabled ? roofWidth : roofWidth*.57;
          const outer = ring(roofWidth, roofDepth, eaves - .005);
          const bendDepth = roofDepth*.72;
          const bendY = eaves + rise*.25;
          const bend = ring(roofWidth*(isGabled ? 1 : .96), bendDepth, bendY);
          const ridge = ring(ridgeWidth, .062, ridgeY);
          if (isGabled) {
            const edgeY = THREE.MathUtils.lerp(eaves-.005, bendY, (roofDepth-d)/(roofDepth-bendDepth));
            const profile = [[d/2, edgeY], [bendDepth/2, bendY], [.031, ridgeY],
              [-.031, ridgeY], [-bendDepth/2, bendY], [-d/2, edgeY]];
            for (const side of [-1, 1]) {
              const u = side*w/2;
              for (let i = 1; i < profile.length; i++) {
                const [z0, y0] = profile[i-1];
                const [z1, y1] = profile[i];
                const a = point(u, eaves, z0);
                const b = point(u, eaves, z1);
                const c = point(u, y1, z1);
                const previous = point(u, y0, z0);

          }
          const faces = isGabled ? [0, 2] : [0, 1, 2, 3];
          const fascia = ring(roofWidth, roofDepth, eaves - .09);
          const roofEdge = roofTone.clone().multiplyScalar(.81);
          for (const i of faces) {
            const next = (i + 1) % 4;
            quad(outer[i], outer[next], bend[next], bend[i], roofShades[i]);
            quad(bend[i], bend[next], ridge[next], ridge[i], roofShades[i]);
            quad(fascia[i], fascia[next], outer[next], outer[i], roofEdge);
          }
          if (isGabled) {
            for (const edge of [[outer[1], bend[1], ridge[1], ridge[2], bend[2], outer[2]],
              [outer[3], bend[3], ridge[3], ridge[0], bend[0], outer[0]]]) {
              for (let i = 1; i < edge.length; i++) {
                const [a, b] = [edge[i-1], edge[i]];

              }

        }

        function window(u, y, t, width, height, side, glow) {
          const offset = .022;

          // divides the two panes, and a raised sill casts a darker lower edge.
          const panel = (color, tangent, dy, normal, pw, ph) => {

            piece(color, cx, y + dy, cz, side ? .017 : pw, ph, side ? pw : .017);

          panel(glow ? warmGlass : darkGlass, -.25*width + .01, 0, offset + .013, paneWidth, height - .105);
          panel(glow ? warmCurtain : darkGlass, .25*width - .01, 0, offset + .013, paneWidth, height - .105);
          panel(trim, 0, -height/2, offset + .023, width + .13, .071);
        }

        const entrance = w*.23;
        const doorHeight = Math.min(1.70, eaves*.70);
        piece(windowFrame, entrance, .16 + doorHeight/2, d/2 + .019, .68, doorHeight, .052);
        piece(darkGlass, entrance, .16 + doorHeight*.66, d/2 + .05, .45, doorHeight*.54, .022);
        piece(roofTone, entrance, .22 + doorHeight, d/2 + .21, 1.02, .073, .56);
        piece(concrete, entrance, earth + .0725, d/2 + .29, .96, .145, .49);
        piece(concrete, entrance, earth + .04, d/2 + .83, .84, .08, .81);
        window(-w*.19, .21 + doorHeight*.61, d/2, w*.32, .65, 0, lit === 0);
        window(w/2, eaves*.59, -d*.09, d*.29, .64, 1, lit === 1);
        window(-w/2, eaves*.60, d*.12, d*.24, .59, -1, lit === 2);
        window(-w*.15, eaves*.61, -d/2, w*.29, .59, 0, false);
        if (eaves > 2.72) {
          window(w*.21, eaves*.82, d/2, w*.24, .44, 0, lit === 3);
        }
      }

      const west = -SITE_HALF_WIDTH;
      const rear = SITE_BACK;
      const turn = Math.PI / 2;
      const houses = [
        {x:west-5.3, z:6.15, w:3.55, d:4.18, eaves:2.34, rise:.92, roof:'gable', wall:0x7d8698, tile:0x647693, turn, lit:0},
        {x:west-6.3, z:-10.6, w:4.60, d:4.40, eaves:2.78, rise:1.03, roof:'hip', wall:0x818397, tile:0x65728d, turn},
        {x:west-12.1, z:1.10, w:4.10, d:3.86, eaves:2.48, rise:.80, roof:'gable', wall:0x7b899e, tile:0x637693, lit:1},
        {x:west-12.4, z:-13.85, w:4.82, d:4.28, eaves:2.56, rise:.47, roof:'flat', wall:0x8290a5, tile:0x687d97},
        {x:-11.25, z:rear-4.45, w:4.24, d:3.81, eaves:2.65, rise:.91, roof:'hip', wall:0x838b9b, tile:0x637291, lit:0},
        {x:-6.15, z:rear-6.62, w:3.52, d:3.70, eaves:2.29, rise:.84, roof:'gable', wall:0x7a889e, tile:0x617693},
        {x:10.90, z:rear-4.91, w:4.06, d:3.68, eaves:2.73, rise:1.08, roof:'gable', wall:0x7b889d, tile:0x5f728e, lit:0},
        {x:16.95, z:rear-7.19, w:4.62, d:4.42, eaves:2.76, rise:.91, roof:'hip', wall:0x7e8498, tile:0x65738c},
        {x:-13.80, z:rear-12.15, w:4.89, d:4.32, eaves:2.87, rise:.77, roof:'gable', wall:0x8390a4, tile:0x6a7b95},
        {x:-6.15, z:rear-14.32, w:3.65, d:3.70, eaves:2.54, rise:.58, roof:'flat', wall:0x8491a5, tile:0x6e8099, lit:3},
        {x:10.70, z:rear-13.05, w:4.15, d:4.17, eaves:2.38, rise:.95, roof:'hip', wall:0x8791a4, tile:0x6c7f9a},
        {x:16.38, z:rear-16.73, w:4.18, d:3.87, eaves:2.70, rise:.82, roof:'gable', wall:0x8792a5, tile:0x6e819b},
        {x:-16.10, z:rear-18.76, w:4.46, d:4.08, eaves:2.59, rise:.85, roof:'hip', wall:0x8792a5, tile:0x70829b},
        {x:-7.75, z:rear-20.28, w:4.00, d:3.73, eaves:2.47, rise:.65, roof:'gable', wall:0x8895a9, tile:0x74859e}
      ];
      houses.forEach(house);

      const hedge = [0x677d84, 0x74858d, 0x6b808a, 0x7b8992];
      const foliage = [0x6a828b, 0x708992, 0x7d9199, 0x76909a];
      const random = randomFrom(2177);
      function shrub(x, z, radius) {
        for (let i = 0; i < 4; i++) {
          const angle = i*Math.PI/2 + random()*.33;
          const scale = radius*(.74 + random()*.3);
          crown(hedge[i], x + Math.cos(angle)*radius*.49, scale*.48,
            z + Math.sin(angle)*radius*.48, scale, scale*.66, scale*.83, angle);
        }
      }
      function tree(x, z, height, width) {
        const trunkTop = [x - .11, height*.76, z + .05];
        stem(0x6d7181, [x, earth, z], trunkTop, height*.039);
        for (let i = 0; i < 5; i++) {
          const angle = i*Math.PI*2/5 + random()*.4;
          const branch = [x + Math.cos(angle)*width*.62, height*(.58 + random()*.13),
            z + Math.sin(angle)*width*.64];
          stem(0x707888, [x, height*.30, z], branch, height*.017);
          crown(foliage[i%foliage.length], branch[0], branch[1] + height*.08, branch[2],

        }
        crown(foliage[2], x - .09, height*.78, z + .04, width*.75, height*.25, width*.71, .8);

    function buildStreetLife(parent) {
      const streetLife = new THREE.Group();

      function frame(x, z, yaw = 0, y = pavement) {
        const host = new THREE.Group();

      function detail(host, geometry, finish, point, size, rotation = unrotated, cast = true, color) {
        const key = `${geometry.id}/${finish.id}/${cast}`;
        if (!detailBatches.has(key)) detailBatches.set(key, {geometry, finish, cast, matrices:[], colors:[]});
        stamp.compose(new THREE.Vector3(...point), rotation, new THREE.Vector3(...size));
        const batch = detailBatches.get(key);
        batch.matrices.push(stamp.clone().premultiply(host.matrix));
        batch.colors.push(color);

      function box(host, finish, point, width, height, depth, rotation = unrotated, cast = true) {

      function segment(host, finish, start, end, radius, taper = false, cast = true) {
        const point = new THREE.Vector3(...start);

        const rotation = new THREE.Quaternion().setFromUnitVectors(up, axis.normalize());

      function yaw(angle) {

      const flat = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), -Math.PI/2);

      box(utility,cream,[.092,.403,.18],.09,.12,.011,unrotated,false);

      const skinWarm = material('#c79a7f');

      // Elliptical cross sections soften the coats at the hips and shoulders.

          for (let i=0; i<sides; i++) {
            const a = i/sides * Math.PI*2;
            positions.push(width*Math.cos(a),y,center+depth*Math.sin(a));

        for (let row=0; row<profile.length-1; row++) {
          for (let i=0; i<sides; i++) {

        oval(host,hair,facePoint(.034,.084,.045),.060,.045,.051,orientation);
        oval(host,skin,facePoint(0,-.006,.095),.021,.027,.022,orientation);

      function facadeWall(face, faceWidth, lowerY, upperY, openings, wallColor) {

          sortedY.push(Math.max(lowerY, opening.y0), Math.min(upperY, opening.y1));
        }
        const cutsY = [...new Set(sortedY)].sort((a, b) => a - b);
        for (let row = 0; row < cutsY.length - 1; row++) {
          const y0 = cutsY[row];
          const y1 = cutsY[row + 1];
          const midY = (y0 + y1) / 2;
          const cutsX = openings.filter((hole) => midY > hole.y0 && midY < hole.y1)
            .map(({ x0, x1 }) => [x0, x1]).sort((a, b) => a[0] - b[0]);
          const merged = [];
          for (const [x0, x1] of cutsX) {
            const last = merged[merged.length - 1];
            if (last && x0 <= last[1]) last[1] = Math.max(last[1], x1);
            else merged.push([x0, x1]);
          }
          let cursor = -faceWidth / 2;
          for (const [x0, x1] of merged) {
            if (x0 > cursor) box(face, (cursor + x0) / 2, midY, z, x0 - cursor, y1 - y0, thickness, wallColor);

            const a = row / segments;
            const b = (row + 1) / segments;

            const p1 = [right, y - edge(a), .094 + reach * a];
            const p2 = [right, y - edge(b), .094 + reach * b];
            const p3 = [left, y - edge(b), .094 + reach * b];
            append([p0, p2, p1, p0, p3, p2], hex);

    // Tsukiakari Mart geometry and lettering adapted from rainy-corner-live.html.
    function buildTsukiakariStore(installation, lightPaint) {
      const T=THREE, pi=Math.PI;

      const cylGeo=new T.CylinderGeometry(1,1,1,12);
      const planeGeo=new T.PlaneGeometry();
      // Mirror the building to put the glazed corner on the visible street.
      // Correct the plane UVs so Japanese letters and small labels read normally.
      const uv=planeGeo.getAttribute('uv');
      for(let i=0;i<uv.count;i++) uv.setX(i,1-uv.getX(i));

      function paint(color) {
        if(!cache.has(color)) cache.set(color,new T.MeshStandardMaterial({color,roughness:.78}));
        return cache.get(color);
      }
      const lit=color=>{
        const key='lamp:'+color;
        if(!cache.has(key)) cache.set(key,new T.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.63,roughness:.63}));
        return cache.get(key);
      };
      const warm=lit('#fff0cc');
      warm.emissiveIntensity=1.23;
      function mesh(parent,geo,material,x,y,z) {
        const result=new T.Mesh(geo,typeof material==='string'?paint(material):material);
        result.position.set(x,y,z);
        result.receiveShadow=!result.material.transparent;
        parent.add(result);
        return result;

      function box(parent,x,y,z,w,h,d,material,structural=false) {
        const result=mesh(parent,boxGeo,material,x,y,z);

      function instance(geometry, finish, x, y, z, w, h, d, rotation = quaternion, shadows = true) {
        const key = `${geometry.id}/${finish.id}/${shadows}`;
        if (!batches.has(key)) batches.set(key, {geometry, finish, shadows, matrices: []});
        part.position.set(x, y, z);
        part.quaternion.copy(rotation);
        part.scale.set(w, h, d);
        part.updateMatrix();
        batches.get(key).matrices.push(part.matrix.clone());
      }

      function box(finish, x, y, z, w, h, d, shadows = true) {
        instance(unitBox, finish, x, y, z, w, h, d, quaternion, shadows);
      }

      function rod(finish, a, b, radius, shadows = true) {
        const start = new THREE.Vector3(...a);
        const end = new THREE.Vector3(...b);
        const delta = end.clone().sub(start);
        const length = delta.length();
        const mid = start.lerp(end, .5);
        const rotation = new THREE.Quaternion().setFromUnitVectors(up, delta.normalize());
        instance(unitCylinder, finish, mid.x, mid.y, mid.z, radius, length, radius, rotation, shadows);
      }

      function image(width, height, draw) {
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        draw(canvas.getContext('2d'), width, height);
        const map = new THREE.CanvasTexture(canvas);
        map.colorSpace = THREE.SRGBColorSpace;
        map.anisotropy = 6;
        return map;

      function speckle(ctx, width, height, amount, seed) {

      function instance(group, geometry, finish, position, scale, rotation, cast) {
        const finishId = Array.isArray(finish) ? finish.map(material => material.id).join(',') : finish.id;

        if (!batches.has(key)) batches.set(key,{group,geometry,finish,cast,matrices:[]});

        stamp.quaternion.copy(rotation);

      const roomLight = {
        dusk: ['#92b9e9',.20,-.25,-.12],

      function roomGeometry(face, mode, x, y, width, height) {
        if (face.userData.sharedShop && y < 2.25) return;

      const graphite = paint('#353a47');

      function apartmentWindow(mode, [top,bottom,emission]) {

      function windowUnit(face, x, y, width, height, lit, rim, transom = .22) {

      function balcony(face, x, floor, width, depth = .60) {

      function planter(face, x, y, z, size, flower = true, finish = potClay) {

          if (flower && i%2 === 0) instance(face,sharedLeaf,petals[i%3],stem,[.044*size,.041*size,.039*size],identity,false);

      function towel(face, finish, x, y, z, width, length, phase) {
        const cloth = new THREE.PlaneGeometry(width,length,12,12);
        const vertices = cloth.attributes.position;
        for (let i=0;i<vertices.count;i++) {
          const px = vertices.getX(i);
          const py = vertices.getY(i);
          const pct = py/length + .5;
          const top = Math.pow(pct,8);
          const fold = Math.sin((px/width+.5)*Math.PI*5+phase)*.021;
          vertices.setXYZ(i,px,py+Math.cos(px/width*8+phase)*.017*(1-pct),fold*(1-top)-top*.065);

      function roofSeams(group, width, depth, y, angle) {
        const half = width/2;
        const slopeWidth = (half+.02)/Math.cos(angle);
        const ridge = y + Math.tan(angle)*half;
        const gable = new THREE.Shape();
        gable.moveTo(-half+.13,0);
        gable.lineTo(0,ridge-y-.015);
        gable.lineTo(half-.13,0);
        gable.closePath();
        const core = new THREE.Mesh(new THREE.ExtrudeGeometry(gable,{depth:depth-.24,bevelEnabled:false}),warmFrame);
        core.position.set(0,y-.025,-depth/2+.12);
        core.castShadow = true;
        core.receiveShadow = true;
        group.add(core);
        for (const direction of [-1,1]) {
          const rotation = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),-direction*angle);
          const midX = direction*half/2;
          const midY = (ridge+y)/2;
          instance(group,sharedBox,zinc,[midX,midY,0],[slopeWidth,.09,depth],rotation,true);
          for (let i=0;i<7;i++) {
            const x = i*half/6.6;
            box(group,zincSeam,direction*x,ridge-Math.tan(angle)*x+.055,0,.028,.036,depth+.014,false);
          }
          box(group,warmFrame,direction*half,y-.029,0,.081,.104,depth+.02);
          for (const z of [-(depth-.045)/2,(depth-.045)/2]) {
            instance(group,sharedBox,zincSeam,[midX,midY-.01,z],[slopeWidth,.092,.053],rotation,true);
          }
        }
        pipe(group,zincSeam,[0,ridge+.065,-depth/2],[0,ridge+.065,depth/2],.052);
      }

        instance(face,sharedBox,finish,[x,y,z],[width,.077,depth],rotation,true);
        for (let i=1;i<10;i+=2) {
          const lane = x + width*(i/10-.5);
          instance(face,sharedBox,stripe,[lane,y+.043,z],[width/10,.011,depth*.995],rotation,false);

        box(face,finish,x,y-Math.sin(angle)*depth/2-.065,depth+.036,width,.145,.055);
        for (let i=1;i<10;i+=2) box(face,stripe,x+width*(i/10-.5),y-Math.sin(angle)*depth/2-.065,depth+.066,width/10,.146,.010,false);

      function signMap({title,subtitle,bg,ink,stripe,vertical}) {
        return canvasMap(vertical?144:620,vertical?620:144,(ctx,w,h) => {
          ctx.fillStyle = bg;
          ctx.fillRect(0,0,w,h);
          ctx.strokeStyle = stripe;
          ctx.lineWidth = 5;
          ctx.strokeRect(10,10,w-20,h-20);
          ctx.strokeStyle = ink;
          ctx.lineWidth = 1.6;
          ctx.strokeRect(17,17,w-34,h-34);
          ctx.fillStyle = ink;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.font = `700 ${vertical?71:66}px ${serif}`;
          if (vertical) {
            [...title].forEach((glyph,i) => ctx.fillText(glyph,w/2,82+i*(h-206)/Math.max(1,title.length-1)));
            ctx.font = '600 17px sans-serif';
            ctx.fillText(subtitle,w/2,h-49);
          } else {
            ctx.fillText(title,w/2,59);
            ctx.font = '700 17px sans-serif';
            ctx.fillText(subtitle,w/2,110);
          }
          speckle(ctx,w,h,680,421);
        });
      }

      function facadeWithOpenings(face, span, height, finish, openings) {
        const levels=[0,height];
        for(const [,y,,h] of openings) levels.push(THREE.MathUtils.clamp(y-h/2,0,height),THREE.MathUtils.clamp(y+h/2,0,height));
        levels.sort((a,b)=>a-b);
        for(let i=0;i<levels.length-1;i++) {
          const low=levels[i], high=levels[i+1];
          if(high-low<.015) continue;
          const middle=(low+high)/2;
          const gaps=openings.filter(([,y,,h])=>middle>y-h/2&&middle<y+h/2)
            .map(([x,,w])=>[Math.max(-span/2,x-w/2),Math.min(span/2,x+w/2)])
            .filter(([a,b])=>b-a>.02).sort((a,b)=>a[0]-b[0]);
          let cursor=-span/2;
          for(const [left,right] of gaps) {
            if(left>cursor+.012) box(face,finish,(cursor+left)/2,middle,-.045,left-cursor,high-low,.09);
            cursor=Math.max(cursor,right);
          }
          if(cursor<span/2-.012) box(face,finish,(cursor+span/2)/2,middle,-.045,span/2-cursor,high-low,.09);
        }
      }

      function makeBlock({name,x,z,width,depth,height,floors,color,trim,rim,style = 'plaster',parapet = true,rearEntry = false,openings = {front:[],side:[]}}) {

        front.position.z = depth/2;
