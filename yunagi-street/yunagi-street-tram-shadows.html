<head>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <style>
    :root { color-scheme: dark; --ink:#fff0df; --muted:#cab9d0; --line:#eed6e734; --paper:#201e34; --orange:#f3b18d; }
    *, *::before, *::after { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:14px/1.4 'Hiragino Sans GB','Microsoft YaHei','PingFang SC',system-ui,sans-serif; }
    .page { height:100vh; height:100dvh; min-height:460px; display:grid; grid-template-rows:65px minmax(0,1fr) 57px; }
    .masthead, .foot { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:0 clamp(18px,3.25vw,52px); }
    .masthead { border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:12px; }
    .brand-mark { display:grid; place-items:center; width:35px; height:35px; background:#ef997f; color:#2e202d; border-radius:3px; font:20px Georgia,'Yu Mincho','MS Mincho',serif; }
    .brand-name { display:block; font-weight:650; letter-spacing:.12em; }
    .brand-en, .eyebrow { font:600 9px/1.4 system-ui,sans-serif; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); }
    .sky-caption { display:flex; align-items:center; gap:8px; font-size:11px; color:#f1c7b7; letter-spacing:.12em; }
    .sky-caption svg { width:19px; height:19px; color:#f3a689; }
    .weather-toggle { min-width:108px; height:38px; gap:8px; background:#ffffff08; border-color:#eed6e72b; border-radius:20px; font-size:12px; }
    .weather-toggle[aria-pressed="true"] { background:#7d9bb72b; border-color:#bacdd85c; }
    .weather-toggle .weather-change { width:12px; opacity:.65; }
    .stage { isolation:isolate; position:relative; overflow:hidden; touch-action:none; background:linear-gradient(#101c38,#526a8e 47%,#e7a59a 77%,#6c7994); }
    .stage canvas { display:block; width:100%; height:100%; position:absolute; inset:0; outline:none; cursor:grab; }
    .stage canvas:active { cursor:grabbing; }
    .stage canvas:focus-visible { outline:2px solid var(--orange); outline-offset:-5px; }
    .title { position:absolute; z-index:1; left:clamp(20px,4.1vw,64px); top:clamp(19px,5.5%,52px); margin:0; pointer-events:none; }
    h1 { margin:7px 0 3px; color:#fff0df; text-shadow:0 2px 16px #21173860; font:600 clamp(32px,4.05vw,64px)/1.1 'Yu Mincho','Hiragino Mincho ProN','Noto Serif CJK JP','SimSun',Georgia,serif; letter-spacing:.035em; }
    .title p { margin:11px 0 0; font-size:clamp(10px,1vw,13px); color:#ede1ed; letter-spacing:.1em; }
    .frame { position:absolute; inset:13px; border:1px solid #ffead52a; pointer-events:none; }
    .frame::before, .frame::after { position:absolute; content:''; width:9px; height:9px; border-color:#ffe8c9a0; border-style:solid; }
    .frame::before { top:-1px; left:-1px; border-width:1px 0 0 1px; }
    .frame::after { right:-1px; bottom:-1px; border-width:0 1px 1px 0; }
    .foot { border-top:1px solid var(--line); color:#e1d2e2; }
    .hints { display:flex; flex-wrap:wrap; column-gap:18px; row-gap:2px; font-size:11px; }
    .hints span { white-space:nowrap; }
    .controls { display:flex; align-items:center; gap:6px; }
    button { min-width:35px; height:34px; display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:0 9px; border:1px solid var(--line); border-radius:4px; background:#2d2943; color:#f8e8e0; cursor:pointer; font:inherit; font-size:11px; white-space:nowrap; }
    button:hover { border-color:#e8a38d; background:#40324e; }
    button:focus-visible { outline:2px solid var(--orange); outline-offset:2px; }
    button:disabled { opacity:.45; cursor:default; }
    button svg { width:15px; height:15px; }
    .status { position:absolute; z-index:3; left:50%; top:56%; transform:translate(-50%,-50%); width:max-content; max-width:min(86vw,420px); padding:14px 20px; border:1px solid var(--line); border-radius:4px; box-shadow:0 8px 25px #2117384a; background:#2d2943; text-align:center; }
    [hidden] { display:none !important; }
    @media (max-width:640px) {
      .page { grid-template-rows:54px minmax(0,1fr) 60px; }
      .masthead,.foot { padding:0 13px; gap:9px; }
      .frame { inset:7px; }
      .title { left:17px; top:21px; }
      .title p { margin-top:6px; }
      .hints { column-gap:8px; font-size:10px; }
      .button-text { display:none; }
      .controls { gap:4px; }
      button { min-width:34px; padding:0 7px; }
    }
    @media (max-height:630px) and (min-width:641px) {
      .page { grid-template-rows:48px minmax(0,1fr) 46px; }
      h1 { font-size:clamp(30px,4.4vh,42px); }
    }
  </style>

      "imports": {

<body>

      <button type="button" id="weather" class="weather-toggle" aria-label="雨天模式" aria-pressed="false" title="切换为雨天" disabled><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"><path id="weather-icon" d="M3 17h18M6 21h12m-11-4a5 5 0 0 1 10 0M12 3v3M4 8l2 2m14-2-2 2M2 13h3m14 0h3"/></svg><span id="weather-text">晴暮</span><svg aria-hidden="true" class="weather-change" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M2 5h11m-3-3 3 3-3 3M14 11H3m3-3-3 3 3 3"/></svg></button>

    <section class="stage" id="stage" aria-labelledby="scene-title">
      <div class="title"><div class="eyebrow" lang="en">Street Diorama</div><h1 id="scene-title" lang="ja">夕凪の街角</h1><p>日式微缩街景</p></div>

      <div class="hints" id="interaction-hints"><span id="orbit-hint">拖动旋转</span><span id="zoom-hint">滚轮缩放</span><span id="pan-hint">右键拖动平移</span></div>
      <div class="controls" aria-label="场景控制">

        <button type="button" id="zoom-in" title="放大" aria-label="放大" disabled><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14m-7-7v14"/></svg></button>
        <button type="button" id="reset" title="重置视角" aria-label="重置视角" disabled><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a8 8 0 1 1 1.7 6M4 5v6h6"/></svg><span class="button-text">重置</span></button>

  </main>
  <script>
    // Also reports CDN failures, which happen before the module body can run.
    window.sceneLoadTimer = setTimeout(() => {
      const status = document.querySelector('#status');
      status.textContent = '街景加载超时。请检查网络连接后刷新页面。';
    }, 45000);
    if (matchMedia('(pointer: coarse)').matches) {
      document.querySelector('#zoom-hint').textContent = '双指缩放与平移';
      document.querySelector('#pan-hint').hidden = true;
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

    // Stock shadow sampling, restored if the soft-shadow shader cannot compile.
    const STOCK_SHADOW_CHUNK = THREE.ShaderChunk.shadowmap_pars_fragment;
    const SITE_HALF_WIDTH = 14;
    const SITE_WIDTH = SITE_HALF_WIDTH * 2;
    const SITE_LENGTH = 33;
    const SITE_CENTER_Z = -.6;
    const SITE_BACK = SITE_CENTER_Z - SITE_LENGTH / 2;
    const SITE_FRONT = SITE_CENTER_Z + SITE_LENGTH / 2;
    const RAIL_CENTER_Z = -3.4;
    const ROAD_LEFT = -.42;
    const ROAD_RIGHT = 4.86;
    const DRIVEWAY_BACK = 8.65;
    const DRIVEWAY_FRONT = 11.55;
    const CURB_RAMP_TOP = ROAD_RIGHT + .57;
    const STREET_BACK = SITE_BACK - 13;
    const STREET_FRONT = SITE_FRONT + 11;
    const ROAD_CENTER = (ROAD_LEFT + ROAD_RIGHT) / 2;
    const ROAD_WIDTH = ROAD_RIGHT - ROAD_LEFT;
    const ROAD_EDGE = .013;
    const WALK_LEVEL = .176;
    const CROSSINGS = [-8.14, 2.28];
    const CROSSING_HALF = .86;
    const CROSSING_FLARE = .44;
    const CROSSING_RUN = 1.28;
    const ROAD_BOUNDS = {left:ROAD_LEFT,right:ROAD_RIGHT,back:STREET_BACK,front:STREET_FRONT};
    const ROAD_DRAINS = [
      ...[-12.85,-9.75,-6.59,-1.30,.73,3.88,9.10,13.35].map(z=>[ROAD_LEFT+.16,z,-1]),
      ...[-12.43,-9.76,-6.59,-1.46,.73,3.88,7.77,12.29].map(z=>[ROAD_RIGHT-.16,z,1])
    ];
    const UTILITY_COVERS = [[.40,4.87,.24],[3.86,-.22,.23],[.32,-5.62,.24],[4.14,-14.6,.22],[.70,13.03,.246]];

    const BASE_DEPTH = 1.03;
    const UP = new THREE.Vector3(0, 1, 0);

    function randomFrom(seed) {
      return () => {
        seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
        return seed / 4294967296;
      };
    }

    function paintedTexture(width, height, draw) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      draw(canvas.getContext('2d'), width, height);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = 8;
      return texture;
    }

    const material = (color, options = {}) => new THREE.MeshStandardMaterial({color, roughness: .85, ...options});
    const blockGeometry = new THREE.BoxGeometry(1, 1, 1);
    const cylinderGeometryCache = new Map();

    function createBuildingLightPaint() {
      const patches = [];
      const rain = {value: 0};

      // These small pools sit on actual surfaces. Opaque furniture and
      // joinery occlude them, and the glass is drawn over them.
      function add(host, position, size, tint, strength, horizontal = false) {
        const stamp = new THREE.Object3D();
        stamp.position.set(...position);
        stamp.scale.set(...size, 1);
        if (horizontal) stamp.rotation.x = -Math.PI/2;
        stamp.updateMatrix();
        patches.push({host, matrix:stamp.matrix, color:new THREE.Color(tint).multiplyScalar(strength)});
      }

      function mount(parent) {
        const finish = new THREE.ShaderMaterial({
          uniforms:{buildingRain:rain},
          transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
          vertexShader:`
            varying vec2 brush;
            varying vec3 place;
            varying vec3 tint;
            void main() {
              vec4 world = modelMatrix * instanceMatrix * vec4(position,1.0);
              brush = uv * 2.0 - 1.0;
              place = world.xyz;
              tint = instanceColor;
              gl_Position = projectionMatrix * viewMatrix * world;
            }`,
          fragmentShader:`
            uniform float buildingRain;
            varying vec2 brush;
            varying vec3 place;
            varying vec3 tint;
            void main() {
              float reach = length(brush);
              float feather = (1.0-smoothstep(0.43,1.0,reach));
              float light = feather * (0.24 + 0.76 * exp(-4.2*dot(brush,brush)));
              float border = max(abs(place.x)/${SITE_HALF_WIDTH.toFixed(1)},abs(place.z-(${SITE_CENTER_Z}))/${SITE_LENGTH/2});
              float lowMist = smoothstep(0.75,1.08,border) * exp(-max(place.y-0.17,0.0)*0.87);
              gl_FragColor = vec4(tint,light * (1.0-lowMist) * mix(0.88,1.27,buildingRain));
              #include <tonemapping_fragment>
              #include <colorspace_fragment>
            }`
        });
        parent.updateWorldMatrix(true,true);
        const intoParent = parent.matrixWorld.clone().invert();
        const matrix = new THREE.Matrix4();
        const batch = new THREE.InstancedMesh(new THREE.PlaneGeometry(1,1),finish,patches.length);
        batch.name = 'Painted building light pools';
        batch.renderOrder = -2;
        patches.forEach(({host,matrix:local,color},index) => {
          batch.setMatrixAt(index,matrix.copy(intoParent).multiply(host.matrixWorld).multiply(local));
          batch.setColorAt(index,color);
        });
        parent.add(batch);
      }

      return {add,mount,setRain(amount) {rain.value=amount;}};
    }

    // Batch static geometry by finish within a building or street block.
    // Keeping batches local lets the camera still cull off-screen blocks.
    function batchStaticParts(root) {
      root.updateWorldMatrix(true,true);
      const cellSize = 8;
      const sectors = new Map();
      const inverse = root.matrixWorld.clone().invert();
      const center = new THREE.Vector3();
      const geometryMatrix = new THREE.Matrix4();
      const instanceMatrix = new THREE.Matrix4();

      for (const section of root.children) {
        section.traverseVisible(part => {
          if (!part.isMesh || part.children.length || part.name || Object.keys(part.userData).length ||
              Array.isArray(part.material) || part.material.transparent || !part.material.visible ||
              part.renderOrder !== 0 || part.layers.mask !== 1 || !part.frustumCulled ||
              part.instanceColor || part.customDepthMaterial ||
              part.geometry.morphAttributes.position || part.matrixWorld.determinant() <= 0) return;
          if (part.isInstancedMesh) {
            if (!part.boundingSphere) part.computeBoundingSphere();
            center.copy(part.boundingSphere.center);
          } else {
            if (!part.geometry.boundingSphere) part.geometry.computeBoundingSphere();
            center.copy(part.geometry.boundingSphere.center);
          }
          center.applyMatrix4(part.matrixWorld);
          const sector = section.isGroup && section.name ? section.id :
            `${Math.floor(center.x/cellSize)},${Math.floor(center.z/cellSize)}`;
          const key = `${sector}/${part.material.id}/${part.castShadow}/${part.receiveShadow}`;
          if (!sectors.has(key)) sectors.set(key,[]);
          sectors.get(key).push(part);
        });
      }

      function replaceParts(parts, replacement) {
        const first = parts[0];
        replacement.castShadow = first.castShadow;
        replacement.receiveShadow = first.receiveShadow;
        for (const part of parts) part.removeFromParent();
        root.add(replacement);
      }

      for (const parts of sectors.values()) {
        if (parts.length < 2) continue;
        const byGeometry = new Map();
        for (const part of parts) {
          if (!byGeometry.has(part.geometry)) byGeometry.set(part.geometry,[]);
          byGeometry.get(part.geometry).push(part);
        }
        const smallPieces = [];
        for (const [geometry,pieces] of byGeometry) {
          if (pieces.length === 1) {
            const [part] = pieces;
            if (!part.isInstancedMesh && geometry.index && geometry.attributes.position.count < 1800 &&
                Object.keys(geometry.attributes).sort().join(',') === 'normal,position,uv' &&
                geometry.drawRange.start === 0 && geometry.drawRange.count === Infinity) smallPieces.push(part);
            continue;
          }
          const count = pieces.reduce((sum,part)=>sum+(part.isInstancedMesh ? part.count : 1),0);
          const batch = new THREE.InstancedMesh(geometry,pieces[0].material,count);
          let index = 0;
          for (const part of pieces) {
            const matrix = geometryMatrix.multiplyMatrices(inverse,part.matrixWorld);
            if (part.isInstancedMesh) {
              for (let i=0;i<part.count;i++) {
                part.getMatrixAt(i,instanceMatrix);
                batch.setMatrixAt(index++,instanceMatrix.premultiply(matrix));
              }
            } else batch.setMatrixAt(index++,matrix);
          }
          replaceParts(pieces,batch);
        }
        if (smallPieces.length >= 3) {
          const geometries = smallPieces.map(part=>part.geometry.clone().applyMatrix4(
            geometryMatrix.multiplyMatrices(inverse,part.matrixWorld)));
          const merged = mergeGeometries(geometries);
          if (merged) replaceParts(smallPieces,new THREE.Mesh(merged,smallPieces[0].material));
        }
      }
    }

    function place(parent, geometry, finish, x, y, z, cast = true) {
      const mesh = new THREE.Mesh(geometry, finish);
      mesh.position.set(x, y, z);
      mesh.castShadow = cast;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function block(parent, finish, x, y, z, width, height, depth, cast = true) {
      const mesh = place(parent, blockGeometry, finish, x, y, z, cast);
      mesh.scale.set(width, height, depth);
      return mesh;
    }

    function cylinder(parent, finish, x, y, z, top, bottom, height, segments = 10) {
      const key = [top,bottom,segments].join('/');
      if (!cylinderGeometryCache.has(key)) {
        cylinderGeometryCache.set(key,new THREE.CylinderGeometry(top,bottom,1,segments));
      }
      const mesh = place(parent,cylinderGeometryCache.get(key),finish,x,y,z);
      mesh.scale.y=height;
      return mesh;
    }

    function rod(parent, finish, start, end, radius, endRadius = radius, segments = 8) {
      const a = new THREE.Vector3(...start);
      const b = new THREE.Vector3(...end);
      const mid = a.clone().lerp(b, .5);
      const mesh = cylinder(parent, finish, mid.x, mid.y, mid.z, endRadius, radius, a.distanceTo(b), segments);
      mesh.quaternion.setFromUnitVectors(UP, b.sub(a).normalize());
      return mesh;
    }

    function tube(parent, finish, points, radius) {
      const curve = new THREE.CatmullRomCurve3(points.map(point => new THREE.Vector3(...point)));
      return place(parent, new THREE.TubeGeometry(curve, 24, radius, 6, false), finish, 0, 0, 0);
    }

    function crossingEdges(center) {
      return [center-CROSSING_HALF,center+CROSSING_HALF];
    }

    function crossingHeight(x,z,direction) {
      const offset=direction<0?ROAD_LEFT-x:x-ROAD_RIGHT;
      const reach=1-THREE.MathUtils.clamp(offset/CROSSING_RUN,0,1);
      let fade=0;
      for(const center of CROSSINGS) {
        const beyond=Math.max(0,Math.abs(z-center)-CROSSING_HALF);
        fade=Math.max(fade,1-THREE.MathUtils.clamp(beyond/CROSSING_FLARE,0,1));
      }
      return WALK_LEVEL-.150*reach*fade;
    }

    function roadHeight(x) {
      const shoulder=Math.min(Math.abs(x-ROAD_CENTER)/(ROAD_WIDTH/2),1);
      return ROAD_EDGE+.031*(1-shoulder);
    }

    function buildLoweredCurb(parent,finish,edge,direction,center) {
      const [start,end]=crossingEdges(center);
      const breaks=[start-CROSSING_FLARE,start,end,end+CROSSING_FLARE];
      const positions=[];
      function section(z) {
        const low=crossingHeight(edge,z,direction);
        const crown=.008+.008*(low-.026)/.150;
        const backX=edge+direction*.120;
        return [
          [edge-direction*.010,ROAD_EDGE-.004,z],
          [edge-direction*.010,Math.max(ROAD_EDGE+.002,low-.014),z],
          [edge+direction*.019,low+crown,z],
          [backX,crossingHeight(backX,z,direction)+crown,z]
        ];
      }
      function quad(a,b,c,d) {
        positions.push(...a,...b,...c,...a,...c,...d);
      }
      for(let k=0;k<breaks.length-1;k++) {
        const first=breaks[k],last=breaks[k+1],pieces=Math.ceil((last-first)/.58);
        for(let i=0;i<pieces;i++) {
          const startZ=THREE.MathUtils.lerp(first,last,i/pieces);
          const endZ=THREE.MathUtils.lerp(first,last,(i+1)/pieces);
          const a=section(startZ+.004),b=section(endZ-.004);
          for(let j=0;j<a.length-1;j++) quad(a[j],b[j],b[j+1],a[j+1]);
          quad(a[0],a[1],a[2],a[3]);
          quad(b[0],b[3],b[2],b[1]);
        }
      }
      const geometry=new THREE.BufferGeometry();
      geometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
      geometry.computeVertexNormals();
      place(parent,geometry,finish,0,0,0,false);
    }

    function groundAtlas(bounds,width,height,paint) {
      return paintedTexture(width,height,(ctx,w,h)=>{
        ctx.scale(w/(bounds.right-bounds.left),h/(bounds.front-bounds.back));
        ctx.translate(-bounds.left,-bounds.back);
        paint(ctx,bounds);
      });
    }

    function groundGrid(xs,zs,bounds,height) {
      const positions=[],uvs=[],indices=[];
      for (const [row,z] of zs.entries()) {
        for (const [column,x] of xs.entries()) {
          positions.push(x,height(x,z),z);
          uvs.push((x-bounds.left)/(bounds.right-bounds.left),(bounds.front-z)/(bounds.front-bounds.back));
          if (!column || !row) continue;
          const d=row*xs.length+column, a=d-xs.length-1;
          indices.push(a,d-1,d,a,d,d-xs.length);
        }
      }
      const geometry=new THREE.BufferGeometry();
      geometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
      geometry.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    function asphaltTexture() {
      return groundAtlas(ROAD_BOUNDS,704,3440,(ctx,{left,right,back,front})=>{
        const rng=randomFrom(42);
        const length=front-back;
        const base=ctx.createLinearGradient(left,back,right,front);
        base.addColorStop(0,'#525861');base.addColorStop(.49,'#4c515d');base.addColorStop(1,'#595a63');
        ctx.fillStyle=base;
        ctx.fillRect(left,back,right-left,length);

        // The gutter pan, wheel paths and sealed lane joint follow the geometry.
        for (const x of [left,right-.34]) {
          ctx.fillStyle='#3336403b';ctx.fillRect(x,back,.34,length);
          ctx.fillStyle='#b7b9c31a';ctx.fillRect(x+.11,back,.042,length);
        }
        for (const center of [left+.86,left+1.77,right-.86,right-1.77]) {
          const ruts=ctx.createLinearGradient(center-.29,0,center+.29,0);
          ruts.addColorStop(0,'#69707f00');ruts.addColorStop(.48,'#292a3f2c');ruts.addColorStop(1,'#69707f00');
          ctx.fillStyle=ruts;ctx.fillRect(center-.29,back,.58,length);
        }
        ctx.fillStyle='#2e303b43';ctx.fillRect(ROAD_CENTER-.015,back,.030,length);
        ctx.fillStyle='#96959f19';ctx.fillRect(ROAD_CENTER+.025,back,.018,length);

        for (const [x,z,w,d] of [[.31,4.93,.90,.98],[3.81,-.35,.79,1.08],[.34,-5.56,.97,1.01],[4.13,-14.57,.79,.89],[.69,13.04,.83,.92],[4.28,9.97,1.10,2.26]]) {
          ctx.fillStyle='#3436437d';ctx.beginPath();ctx.roundRect(x-w/2,z-d/2,w,d,.11);ctx.fill();
          ctx.strokeStyle='#8c879447';ctx.lineWidth=.022;ctx.stroke();
          ctx.fillStyle='#53525f64';ctx.fillRect(x-w*.40,z-d*.41,w*.80,d*.81);
        }
        for (let i=0;i<29200;i++) {
          const x=left+rng()*(right-left), z=back+rng()*length;
          ctx.fillStyle=i%3?'#dad7c82a':'#21243246';
          ctx.fillRect(x,z,.006+rng()*.021,.008+rng()*.020);
        }
        for (let i=0;i<920;i++) {
          ctx.fillStyle=i%3?'#96909813':'#1e28321b';
          ctx.fillRect(left+rng()*(right-left),back+rng()*length,.015+rng()*.10,.022+rng()*.16);
        }

        ctx.fillStyle='#e0d9ca';
        for (const center of CROSSINGS) {
          const [start,end]=crossingEdges(center);
          for(let i=0;i<8;i++) ctx.fillRect(left+.165+i*.651,start,.374,end-start);
          ctx.fillRect(left+.35,end+.50,ROAD_CENTER-left-.46,.112);
          ctx.fillRect(ROAD_CENTER+.11,start-.61,right-ROAD_CENTER-.46,.112);
        }
        ctx.fillStyle='#babcbe';
        const crossings=CROSSINGS.map(center=>[center-CROSSING_HALF-.14,center+CROSSING_HALF+.14]);
        for(const [x,gaps] of [
          [left+.337,crossings],
          [right-.395,[...crossings,[DRIVEWAY_BACK-.09,DRIVEWAY_FRONT+.10]]]
        ]) {
          let start=back;
          for(const [a,b] of gaps) {
            ctx.fillRect(x,start,.062,a-start);
            start=b;
          }
          ctx.fillRect(x,start,.062,front-start);
        }
        for(let z=back+.36;z<front-.2;z+=2.88) {
          if(CROSSINGS.some(c=>z<c+CROSSING_HALF+.73 && z+1.42>c-CROSSING_HALF-.73)) continue;
          ctx.fillRect(ROAD_CENTER-.043,z,.086,Math.min(1.42,front-z));
        }
        const leftLane=left+ROAD_WIDTH*.25,rightLane=right-ROAD_WIDTH*.25;
        // Keep the approach arrow clear of the stormwater cover in this lane.
        for(const [x,z,rotation] of [[leftLane,8.21,Math.PI],[leftLane,-4.82,Math.PI],[rightLane,-13.21,0],[rightLane,-1.36,0]]) {
          ctx.save();ctx.translate(x,z);ctx.rotate(rotation);
          ctx.beginPath();
          [[-.082,-.64],[.082,-.64],[.082,.19],[.28,.19],[0,.66],[-.28,.19],[-.082,.19]].forEach(([a,b])=>ctx.lineTo(a,b));
          ctx.closePath();ctx.fill();ctx.restore();
        }
        ctx.font='700 .44px "Yu Gothic", "Microsoft YaHei", sans-serif';
        ctx.textAlign='center';
        for (const [x,z,angle] of [[leftLane,6.25,0],[rightLane,-11.66,Math.PI]]) {
          ctx.save();ctx.translate(x,z);ctx.rotate(angle);
          ctx.fillText('徐',0,-.22);ctx.fillText('行',0,.25);
          ctx.restore();
        }
        for (const center of CROSSINGS) {
          for (let i=0;i<550;i++) {
            ctx.fillStyle=i%3?'#3437472d':'#6b667759';
            ctx.fillRect(left+rng()*ROAD_WIDTH,center-1.49+rng()*2.98,.009+rng()*.042,.014+rng()*.024);
          }
        }
      });
    }

    function soilTexture(seed) {
      return paintedTexture(1024, 192, (ctx, w, h) => {
        const rng = randomFrom(seed);
        const layers = ['#8f8380','#7d706c','#61544f','#66544f'];
        const levels = [0,36,70,133];
        ctx.fillStyle = layers[0];
        ctx.fillRect(0, 0, w, h);
        for (let layer = 1; layer < layers.length; layer++) {
          ctx.beginPath();
          for (let x = 0; x <= w; x += 8) {
            const y = levels[layer] + Math.sin(x / (49 + layer * 6) + layer * 1.38) * (layer > 2 ? 8 : 3) + Math.sin(x / 28) * 2;
            ctx.lineTo(x, y);
          }
          ctx.lineTo(w, h);
          ctx.lineTo(0, h);
          ctx.closePath();
          ctx.fillStyle = layers[layer];
          ctx.fill();
          ctx.strokeStyle = '#b6a09240';
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }
        for (let i = 0; i < 2300; i++) {
          ctx.fillStyle = ['#f7d4ae53','#382d4a62','#ab818865','#dfb4a134'][Math.floor(rng() * 4)];
          ctx.beginPath();
          ctx.ellipse(rng() * w, 9 + rng() * (h - 12), .5 + rng() * 4.1, .28 + rng() * 1.3, (rng() - .5) * 2.7, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.strokeStyle = '#b5a48c52';
        for (let i = 0; i < 10; i++) {
          let x = 20 + rng() * (w - 40);
          ctx.beginPath();
          ctx.moveTo(x, 14);
          const length = 30 + rng() * 36;
          for (let y = 18; y < length; y += 5) {
            x += (rng() - .5) * 7;
            ctx.lineTo(x, y);
          }
          ctx.stroke();
        }
      });
    }

    function buildGround(parent, wetRoad) {
      const side = material('#ffffff', {map: soilTexture(201)});
      const otherSide = material('#ffffff', {map: soilTexture(85)});
      const dark = material('#2b3440');
      const trim = material('#8b817c');
      const footing = material('#4a4445');
      block(parent, [side, otherSide, dark, footing, otherSide, side], 0, -.43, SITE_CENTER_Z, SITE_WIDTH, .86, SITE_LENGTH);
      block(parent, trim, 0, -.015, SITE_CENTER_Z, SITE_WIDTH + .036, .034, SITE_LENGTH + .036);
      block(parent, dark, 0, -.915, SITE_CENTER_Z, SITE_WIDTH + .088, .11, SITE_LENGTH + .088);
      block(parent, footing, 0, -1.00, SITE_CENTER_Z, SITE_WIDTH - .22, .06, SITE_LENGTH - .22);
      const grain=paintedTexture(256,256,(ctx,w,h)=>{
        const random=randomFrom(821);
        const pixels=ctx.createImageData(w,h);
        for(let i=0;i<pixels.data.length;i+=4){
          const value=105+random()*105;
          pixels.data[i]=pixels.data[i+1]=pixels.data[i+2]=value;
          pixels.data[i+3]=255;
        }
        ctx.putImageData(pixels,0,0);
      });
      grain.colorSpace=THREE.NoColorSpace;
      grain.wrapS=grain.wrapT=THREE.RepeatWrapping;
      grain.repeat.set(26*ROAD_WIDTH/SITE_WIDTH,30*(STREET_FRONT-STREET_BACK)/SITE_LENGTH);
      grain.offset.set(26*(ROAD_LEFT+SITE_HALF_WIDTH)/SITE_WIDTH,30*(SITE_FRONT-STREET_FRONT)/SITE_LENGTH);
      // Standing water left by the shower is smoother and carries a full clear
      // coat, so the low sun and the lamps glint in the puddles, not everywhere.
      const wetness = wetAsphaltMap();
      wetness.colorSpace = THREE.NoColorSpace;
      const asphaltFinish = new THREE.MeshPhysicalMaterial({
        map: asphaltTexture(), roughness: .92, metalness: .02, roughnessMap: wetness,
        clearcoat: .55, clearcoatMap: wetness, clearcoatRoughness: 1, clearcoatRoughnessMap: wetness,
        bumpMap:grain,bumpScale:.012
      });
      const road=groundGrid([ROAD_LEFT,ROAD_CENTER,ROAD_RIGHT],[SITE_BACK,SITE_FRONT],ROAD_BOUNDS,roadHeight);
      const asphalt=place(parent,road,asphaltFinish,0,0,0,false);
      asphalt.name='Street asphalt';

      const concrete = material('#a4a0a0');
      const paving = material('#b3b0ac', {roughness:.94,map: paintedTexture(256, 256, (ctx, w, h) => {
        const rng = randomFrom(703);
        ctx.fillStyle = '#e1d9d6';
        ctx.fillRect(0, 0, w, h);
        for (let j = 0; j < 8; j++) {
          for (let i = -1; i < 8; i++) {
            const offset = (j % 2) * 20;
            const tone = 228 + rng() * 19;
            ctx.fillStyle = `rgb(${tone + 4},${tone},${tone - 1})`;
            ctx.fillRect(i * 40 + offset + 1, j * 32 + 1, 38, 30);
          }
        }
        for (let i = 0; i < 1100; i++) {
          ctx.fillStyle = rng() > .5 ? '#66515b23' : '#fffff842';
          ctx.fillRect(rng() * w, rng() * h, 1.6, 1.1);
        }
      })});
      paving.map.wrapS = paving.map.wrapT = THREE.RepeatWrapping;
      const curb = material('#e4cdc0');
      const groundLine = material('#8b7b79');
      const stamp = new THREE.Object3D();
      const detailBatches = new Map();
      function tile(finish,x,y,z,w,h,d,angle=0,pitch=0,roll=0,geometry=blockGeometry) {
        stamp.position.set(x, y, z);
        stamp.scale.set(w, h, d);
        stamp.rotation.set(pitch,angle,roll,'ZXY');
        stamp.updateMatrix();
        const key=`${finish.id}/${geometry.id}`;
        if(!detailBatches.has(key)) detailBatches.set(key,{finish,geometry,matrices:[]});
        detailBatches.get(key).matrices.push(stamp.matrix.clone());
      }
      const rampRanges=CROSSINGS.map(center=>{
        const [a,b]=crossingEdges(center);
        return [a-CROSSING_FLARE,a,b,b+CROSSING_FLARE];
      });
      function sidewalk(x0, x1, z0, z1, direction=0) {
        const width = x1 - x0;
        const depth = z1 - z0;
        const x = (x0 + x1) / 2;
        const z = (z0 + z1) / 2;
        const surface = paving.clone();
        surface.map = paving.map.clone();
        surface.map.repeat.set(width / 4, depth / 4);
        surface.map.needsUpdate = true;
        if (direction) {
          const edge=direction<0?x1:x0,outer=direction<0?x0:x1;
          const shoulder=edge+direction*CROSSING_RUN;
          block(parent,concrete,(outer+shoulder)/2,.083,z,Math.abs(outer-shoulder),.166,depth,false);
          // Continue the old support slab except in the tapered crossing strip.
          let start=z0;
          for (const [rampStart,,,rampEnd] of rampRanges) {
            block(parent,concrete,(edge+shoulder)/2,.083,(start+rampStart)/2,CROSSING_RUN,.166,rampStart-start,false);
            start=rampEnd;
          }
          block(parent,concrete,(edge+shoulder)/2,.083,(start+z1)/2,CROSSING_RUN,.166,z1-start,false);
          block(parent,concrete,(edge+shoulder)/2,.008,z,CROSSING_RUN,.016,depth,false);
          const xs=[outer,...[0,.12,.235,.392,.48,.562,.744,1.05,CROSSING_RUN].map(t=>edge+direction*t)].sort((a,b)=>a-b);
          const cuts=rampRanges.flatMap(([a,b,c,d])=>[a,(a+b)/2,b,c,(c+d)/2,d]);
          const geometry=groundGrid(xs,[z0,...cuts,z1],{left:x0,right:x1,back:z0,front:z1},
            (px,pz)=>crossingHeight(px,pz,direction));
          const walkway=place(parent,geometry,surface,0,0,0,false);
          walkway.name=direction<0?'West sidewalk at crossings':'East sidewalk at crossings';
          return;
        }
        block(parent, concrete, x, .083, z, width, .166, depth, false);
        const ground = place(parent, new THREE.PlaneGeometry(width, depth), surface, x, .176, z, false);
        ground.rotation.x = -Math.PI / 2;
      }
      function edge(x,z0,z1,atCrossings=false) {
        const count=Math.ceil((z1-z0)/.70);
        const pitch=(z1-z0)/count;
        for (let i = 0; i < count; i++) {
          let segments=[[z0+i*pitch,z0+(i+1)*pitch]];
          if(atCrossings) for(const [low,,,high] of rampRanges) {
            segments=segments.flatMap(([a,b])=>a>=high||b<=low?[[a,b]]:[[a,Math.min(b,low)],[Math.max(a,high),b]]);
          }
          for(const [a,b] of segments) {
            if(b-a<.028) continue;
            const z=(a+b)/2;
            tile(curb,x,.100,z,b-a-.016,.184,.13,-Math.PI/2);
            tile(groundLine,x-.070,.013,z,b-a-.004,.011,.027,-Math.PI/2);
          }
        }
      }
      sidewalk(-SITE_HALF_WIDTH, ROAD_LEFT, SITE_BACK, SITE_FRONT,-1);
      sidewalk(ROAD_RIGHT, SITE_HALF_WIDTH, SITE_BACK, DRIVEWAY_BACK,1);
      sidewalk(ROAD_RIGHT, SITE_HALF_WIDTH, DRIVEWAY_FRONT, SITE_FRONT);
      sidewalk(CURB_RAMP_TOP, SITE_HALF_WIDTH, DRIVEWAY_BACK, DRIVEWAY_FRONT);
      edge(ROAD_LEFT-.055,SITE_BACK,SITE_FRONT,true);
      edge(ROAD_RIGHT+.055,SITE_BACK,DRIVEWAY_BACK,true);
      edge(ROAD_RIGHT+.055,DRIVEWAY_FRONT,SITE_FRONT);
      const rampCurb=curb.clone();
      rampCurb.side=THREE.DoubleSide;
      for(const center of CROSSINGS) {
        buildLoweredCurb(parent,rampCurb,ROAD_LEFT,-1,center);
        buildLoweredCurb(parent,rampCurb,ROAD_RIGHT,1,center);
      }

      const apron = new THREE.BufferGeometry();
      apron.setAttribute('position', new THREE.Float32BufferAttribute([
        ROAD_RIGHT,ROAD_EDGE,DRIVEWAY_BACK, ROAD_RIGHT,ROAD_EDGE,DRIVEWAY_FRONT,
        CURB_RAMP_TOP,.177,DRIVEWAY_FRONT, CURB_RAMP_TOP,.177,DRIVEWAY_BACK
      ], 3));
      apron.setIndex([0,1,2,0,2,3]);
      apron.computeVertexNormals();
      place(parent, apron, concrete, 0, 0, 0, false);

      const tactile = material('#ba8c3e');
      const raised = material('#e0ae56');
      function groundTile(finish,x,z,direction,y,w,h,d,geometry=blockGeometry) {
        const pitch=-Math.atan2(crossingHeight(x,z+.03,direction)-crossingHeight(x,z-.03,direction),.06);
        const roll=Math.atan2(crossingHeight(x+.03,z,direction)-crossingHeight(x-.03,z,direction),.06);
        tile(finish,x,crossingHeight(x,z,direction)+y,z,w,h,d,0,pitch,roll,geometry);
      }
      for (const [x, ranges] of [
        [ROAD_LEFT-.48,[[SITE_BACK+.21,-9.0],[-7.1,-6.3],[-.64,3.6],[3.9,SITE_FRONT-.28]]],
        [ROAD_RIGHT+.47,[[SITE_BACK+.21,-9.0],[-7.1,-5.6],[-.63,3.6],[4.0,8.4],[11.83,SITE_FRONT-.28]]]
      ]) {
        const direction=x<ROAD_LEFT?-1:1;
        for (const [start,end] of ranges) {
          const count = Math.round((end-start)/.32);
          const pitch = (end-start)/count;
          for (let i = 0; i < count; i++) {
            const z = start + (i+.5)*pitch;
            const nearest=Math.min(...CROSSINGS.map(center=>Math.abs(z-center)));
            const shift=.105*(1-THREE.MathUtils.clamp((nearest-CROSSING_HALF)/.35,0,1));
            const tileX=x+direction*shift;
            groundTile(tactile,tileX,z,direction,.007,.32,.014,pitch-.012);
            for (let j=-1;j<=1;j++) groundTile(raised,tileX+j*.081,z,direction,.019,.022,.015,pitch*.77);
          }
        }
      }
      const dot=new THREE.CylinderGeometry(1,.88,1,7);
      for(const center of CROSSINGS) {
        for(const [x,direction] of [[ROAD_LEFT-.235,-1],[ROAD_RIGHT+.235,1]]) {
          for(let i=-2;i<=2;i++) {
            const z=center+i*.321;
            groundTile(tactile,x,z,direction,.008,.314,.013,.308);
            for(let r=-1;r<=1;r++) {
              for(let c=-1;c<=1;c++) groundTile(raised,x+r*.082,z+c*.081,direction,.019,.019,.012,.019,dot);
            }
          }
        }
      }

      const castIron=material('#555863',{roughness:.76,metalness:.26});
      const wornIron=material('#858083');
      const drainRim=material('#72777c',{roughness:.57,metalness:.27});
      const recess=material('#2e303a',{roughness:1});
      const lidMap=paintedTexture(192,192,(ctx,w,h)=>{
        ctx.fillStyle='#656871';ctx.fillRect(0,0,w,h);
        ctx.translate(w/2,h/2);
        ctx.strokeStyle='#a3a5a645';ctx.lineWidth=2.1;
        for (const r of [82,75,42]) {ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();}
        for(let i=0;i<36;i++) {
          ctx.save();ctx.rotate(i*Math.PI/18);ctx.fillStyle='#3a3946';
          ctx.fillRect(-2.5,63,5,14);ctx.fillStyle='#93929664';ctx.fillRect(-2.5,63,1.3,12);ctx.restore();
        }
        ctx.textAlign='center';ctx.fillStyle='#a2a09b';
        ctx.font='bold 21px "Yu Gothic", sans-serif';ctx.fillText('雨水',0,13);
        ctx.fillStyle='#363943';ctx.fillRect(-10,-39,20,7);ctx.fillRect(-10,33,20,7);
      });
      const lid=material('#abb0b1',{map:lidMap,metalness:.25,roughness:.68});
      for(const [x,z,r] of UTILITY_COVERS) {
        const y=roadHeight(x);
        cylinder(parent,recess,x,y+.0005,z,r*1.119,r*1.12,.010,24);
        cylinder(parent,drainRim,x,y+.004,z,r,r,.010,25);
        const face=place(parent,new THREE.CircleGeometry(r*.895,24),lid,x,y+.011,z,false);
        face.rotation.x=-Math.PI/2;
      }
      for(const [x,z] of ROAD_DRAINS) {
        const y=roadHeight(x);
        tile(recess,x,y+.002,z,.235,.011,.482);
        for(const offset of [-.108,.108]) tile(drainRim,x+offset,y+.010,z,.020,.008,.486);
        for(const offset of [-.230,.230]) tile(drainRim,x,y+.010,z+offset,.199,.008,.022);
        for(let i=-4;i<=4;i++) tile(castIron,x,y+.009,z+i*.046,.199,.009,.017);
      }
      for (const {finish,geometry,matrices} of detailBatches.values()) {
        const instances = new THREE.InstancedMesh(geometry,finish,matrices.length);
        matrices.forEach((matrix,index) => instances.setMatrixAt(index,matrix));
        instances.receiveShadow = true;
        parent.add(instances);
      }

      // Open ends consist of painted collars, dark cavities and concentric gasket rings.
      const pipeClay = material('#b56845');
      const pipeWater = material('#779da5');
      const pipeCable = material('#d8a56e');
      const inner = material('#342934');
      function cutPipe(x, y, radius, finish, face, flare = .10) {
        const orientation = face === 'front' ? Math.PI / 2 : 0;
        const z = face === 'front' ? SITE_FRONT : x;
        const px = face === 'front' ? x : SITE_HALF_WIDTH;
        const disc = place(parent, new THREE.CircleGeometry(radius * .94, 24), inner, px + (face === 'front' ? 0 : .007), y, z + (face === 'front' ? .007 : 0), false);
        disc.rotation.y = Math.PI / 2 - orientation;
        const flange = place(parent, new THREE.TorusGeometry(radius, flare, 8, 26), finish, px, y, z);
        flange.rotation.y = Math.PI / 2 - orientation;
        const gasket = place(parent, new THREE.TorusGeometry(radius * .77, flare * .22, 5, 24), wornIron, px + (face === 'front' ? 0 : .012), y, z + (face === 'front' ? .012 : 0), false);
        gasket.rotation.copy(flange.rotation);
        if (flare < .029) return;
        for (let i = 0; i < 8; i++) {
          const angle = i * Math.PI / 4;
          const lateral = Math.cos(angle) * radius;
          const offset = flare * .83;
          place(parent, new THREE.SphereGeometry(flare*.25, 6, 5), wornIron, px + (face === 'front' ? lateral : offset), y + Math.sin(angle) * radius, z + (face === 'front' ? offset : lateral), false);
        }
      }
      cutPipe(-5.87,-.44,.21,pipeClay,'front',.038);
      cutPipe(-.14,-.55,.135,pipeWater,'front',.027);
      for (const x of [5.80,6.0,6.2]) cutPipe(x,-.37,.061,pipeCable,'front',.017);
      cutPipe(3.43,-.45,.196,pipeClay,'right',.034);
      cutPipe(-3.45,-.59,.138,pipeWater,'right',.027);
      cutPipe(-.61,-.33,.065,pipeCable,'right',.016);
      cutPipe(-.83,-.33,.065,pipeCable,'right',.016);
      cutPipe(11.98,-.53,.122,pipeWater,'right',.022);
      cutPipe(-12.9,-.48,.174,pipeClay,'right',.031);
      return wetRoad ? buildPuddles(parent) : null;
    }

    function buildTrafficMirror(parent, copper, gray, reflectScene) {
      const mount=new THREE.Group();
      mount.name='Roadside convex mirror';
      const x=5.90,z=1.04;
      mount.position.set(x,crossingHeight(x,z,1)+.002,z);
      mount.rotation.y=-.23;
      parent.add(mount);
      cylinder(mount,gray,0,.104,0,.126,.153,.208,16);
      cylinder(mount,copper,0,1.28,0,.052,.076,2.56,14);
      cylinder(mount,gray,0,.221,0,.081,.093,.045,14);
      rod(mount,copper,[0,2.25,0],[-.13,2.73,.04],.066);

      const head=new THREE.Group();
      head.position.set(-.16,2.75,.056);
      head.rotation.x=.128;
      mount.add(head);
      const shell=place(head,new THREE.CylinderGeometry(.454,.435,.106,34),copper,0,0,.018);
      shell.rotation.x=Math.PI/2;
      place(head,new THREE.TorusGeometry(.447,.039,8,42),copper,0,0,.086);

      const curvature=1.04, aperture=.438;
      const rimAngle=Math.asin(aperture/curvature);
      const cap=new THREE.SphereGeometry(curvature,40,15,0,2*Math.PI,0,rimAngle);
      cap.rotateX(Math.PI/2);
      cap.translate(0,0,-curvature*Math.cos(rimAngle));
      if (!reflectScene) {
        const metal=material('#bac8d1',{metalness:.92,roughness:.25});
        place(head,cap,metal,0,0,.068,false).name='Convex traffic lens';
        return null;
      }

      // One street view per settled weather, sampled through the spherical normals.

        dispose(){ target.dispose(); }
      };

    function paintEveningSky() {

        }

          const field=noise(u*4,v*12)*.56+noise(u*9+17,v*26)*.28+noise(u*23,v*49)*.16;
